<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escritório – Next Co.</title>
<link rel="stylesheet" href="css/base.css">
<style>
html,body{height:100%;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;z-index:10;pointer-events:none}
.top>*{pointer-events:auto}
#sala{padding:9px 13px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
#eu{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;font-weight:650;font-size:14px}
#eu canvas{width:30px;height:30px;border-radius:8px;background:#cfc7b6}
.zoom{position:fixed;right:8px;top:62px;display:flex;flex-direction:column;z-index:10;overflow:hidden}
.zoom button{width:42px;height:42px;font-size:20px;font-weight:700}
.emotes{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;z-index:10;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.emotes button{padding:9px 12px;border-radius:9px;font-weight:650;font-size:13px;white-space:nowrap}
.emotes button:active{background:var(--chip)}
#btnAudio.mudo{background:#e5484d!important}
@media (max-width:760px){.emotes button{padding:8px 9px;font-size:12px}}
#hint{position:fixed;left:8px;top:62px;z-index:9;font-size:12px;color:#fff;background:rgba(20,16,32,.7);padding:6px 10px;border-radius:9px;pointer-events:none}
#joy{position:fixed;left:22px;bottom:84px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);z-index:11;display:none;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sheet{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:auto;transition:transform .18s ease}
@media (max-width:760px){.sheet{left:0;right:0;bottom:0;max-height:70vh;border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}.sheet.hidden{transform:translateY(105%)}#sala{max-width:42vw}}
@media (min-width:761px){.sheet{top:60px;right:60px;width:340px;max-height:calc(100vh - 130px);border-radius:14px;padding:14px}.sheet.hidden{transform:translateX(calc(100% + 90px))}}
.sheet h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;font-size:22px;width:34px;height:34px;border-radius:8px}
.mi{display:flex;width:100%;text-align:left;padding:11px 10px;border-radius:9px;font-weight:600;gap:10px;align-items:center;text-decoration:none;color:inherit}
.mi:hover{background:var(--chip)}
.sep{height:1px;background:var(--line);margin:6px 0}
.act{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.act b{display:block}.act small{color:var(--mut)}
.ico{width:28px;height:28px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* ---- painel de tendências (TI) ---- */
.tend-bg{position:fixed;inset:0;z-index:60;background:rgba(8,6,14,.78);display:grid;place-items:center;padding:14px}
.tend-win{width:min(1100px,100%);height:min(88vh,900px);background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tend-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0f3a44,#13a6b8);color:#fff}
.tend-top>b{font-size:16px;white-space:nowrap}
.tend-agentes{display:flex;gap:6px;overflow-x:auto;flex:1}
.tend-agentes .ag{font-size:12px;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;white-space:nowrap}
.tend-agentes .ag small{opacity:.75}
.tend-agentes .ag.on{background:rgba(92,255,122,.25)}
.tend-x{color:#fff;font-size:18px;width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.2)}
.tend-barra{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tend-barra .tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-weight:650;font-size:13px}
.tend-barra .tab.on{background:#13a6b8;color:#fff;border-color:#13a6b8}
.tend-barra .tab i{font-style:normal;opacity:.7;margin-left:3px}
.tend-barra input{margin-left:auto;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--chip);padding:0 10px;min-width:160px}
.tend-form{display:grid;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--chip)}
.tend-form input,.tend-form textarea,.tend-form select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel)}
.tend-form .row2{display:flex;gap:6px;flex-wrap:wrap}.tend-form .row2 input{flex:1;min-width:140px}
.tend-lista{flex:1;overflow:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;align-content:start}
.tend-vazio{color:var(--mut);grid-column:1/-1;text-align:center;padding:40px 10px}
.tc{border:1px solid var(--line);border-left:4px solid #f2a33a;border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.tc.pega{border-left-color:#3fbf5f}.tc.nao_pega{border-left-color:#e5484d;opacity:.85}
.tc-top{display:flex;gap:8px;align-items:flex-start}.tc-top b{flex:1;font-size:15px;line-height:1.3}
.estrelas{color:#f2a33a;font-size:12px;white-space:nowrap}
.tc-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);align-items:center}
.tc-meta .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink)}
.tc-meta a{color:var(--brand);font-weight:650}
.tc p{margin:0;font-size:13.5px}
.tc-acoes{display:flex;gap:6px;flex-wrap:wrap}
.tc-acoes button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-weight:650;font-size:13px;background:var(--chip)}
.tc-acoes .dec.pega.on{background:#3fbf5f;color:#fff;border-color:#3fbf5f}
.tc-acoes .dec.nao.on{background:#e5484d;color:#fff;border-color:#e5484d}
.tc-acoes .trava.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.tc-acoes .del{margin-left:auto}
/* sala de Edição */
.ed-win .tend-barra .tab.on{background:#e04fa0;border-color:#e04fa0}
.ed-win .tend-barra select{margin-left:auto;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--chip);padding:0 8px;max-width:260px}
.ed-win .tend-lista{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.ed-win .tc{border-left-color:#e04fa0}.ed-win .tc.aprovado{border-left-color:#3fbf5f}.ed-win .tc.gravando{border-left-color:#f2a33a}.ed-win .tc.publicado{border-left-color:#2fd4e8}.ed-win .tc.descartado{opacity:.6;border-left-color:#6b6577}
.ed-win .tc-acoes .btn.pri,.ed-win .ed-video .btn.pri{background:#e04fa0;color:#fff;border-color:#e04fa0}
.ed-win .tc-meta select{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:3px 6px;font-size:12px}
.ed-rot:has(.ed-detalhe){grid-column:1/-1}
.ed-dica{grid-column:1/-1;margin:2px 0;color:var(--mut);font-size:13px}
.ed-gancho{font-style:italic}
.ed-detalhe h4{margin:8px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.ed-texto{white-space:pre-wrap}
.ed-cenas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ed-cena{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--chip);display:flex;flex-direction:column;gap:5px;font-size:13px}
.ed-cena b small{font-weight:500;color:var(--mut);margin-left:4px}
.ed-cena span{display:block;font-size:11px;font-weight:700;color:var(--mut)}
.ed-video{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:10px}
.ed-video .btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);font-weight:700;text-decoration:none}
.ed-salvo{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ed-salvo-acoes{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ed-salvo-acoes .btn{padding:7px 12px;border-radius:9px;border:1px solid var(--line);font-weight:700;font-size:13px;background:var(--chip);text-decoration:none;color:var(--ink)}
.ed-win .btn.ok{background:#3fbf5f;color:#fff;border-color:#3fbf5f}
.ed-st{font-weight:700;color:var(--ink)}.ed-st.aguardando{color:#d48a12}.ed-st.aprovado{color:#2e9e4c}
.ed-win .tc.aguardando{border-left-color:#f2a33a}
.ed-aguarda{background:#fff3dc;color:#8a5a00;border:1px solid #f2c97a;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px}
.ed-voz{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:650;cursor:pointer}
.ed-canvas{width:min(270px,100%);aspect-ratio:9/16;border-radius:10px;background:#000}
.tc-acoes button:disabled{opacity:.45;cursor:not-allowed}
.tc-quem{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
/* ---- acesso / administração ---- */
.acc-bg{position:fixed;inset:0;z-index:70;background:rgba(8,6,14,.7);display:grid;place-items:center;padding:14px}
.acc-win{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow:auto}
.acc-win.larga{width:min(640px,100%)}
.acc-win h3{margin:0;display:flex;align-items:center;font-size:17px}
.acc-win h3 .x{margin-left:auto;font-size:22px;width:34px;height:34px;border-radius:8px}
.acc-win input[type=password]{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 12px}
.acc-mut{color:var(--mut);font-size:12.5px;margin:0}
.acc-err{color:var(--bad);font-size:13px;min-height:16px}
.acc-row{display:flex;gap:8px;justify-content:flex-end}
.acc-sec{font-weight:800;margin:10px 0 2px}.acc-sec small{color:var(--mut);font-weight:500}
.acc-sec2{font-weight:700;font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:center}
.acc-sala{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.acc-sala b{min-width:120px}.acc-sala small{color:var(--mut);flex:1}
.acc-sel{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--chip);padding:0 8px}
.acc-sala select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--chip);padding:0 8px}
.acc-sala .btn{padding:6px 12px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st.livre{background:var(--chip);color:var(--mut)}.st.rest{background:#ffe1e1;color:#b42318}.st.senha{background:#fff1d6;color:#9a5b00}
.acc-form{display:flex;flex-direction:column;gap:6px;padding:10px;border:2px solid var(--brand);border-radius:12px}
.acc-pessoas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px;padding:6px;background:var(--chip);border-radius:9px}
.ck{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
/* ---- moderação do palco ---- */
#btnMao.on{background:#f2a33a!important;color:#1d1d1f}
#palcoPainel{position:fixed;left:8px;bottom:70px;z-index:15;width:290px;max-height:calc(100vh - 160px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:10px;font-size:13px}
.pp-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.pp-top small{color:var(--mut);margin-left:auto}
.pp-acoes{display:flex;gap:6px}
.pp-btn{flex:1;padding:9px 10px;border-radius:10px;font-weight:800;background:#3fbf5f;color:#fff}
.pp-btn.alerta{background:#e5484d}
.pp-sec{font-weight:800;margin:10px 0 4px;display:flex;gap:6px;align-items:center}
.pp-sec i{font-style:normal;background:#f2a33a;color:#1d1d1f;border-radius:999px;padding:0 7px;font-size:12px}
.pp-linha{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);border-radius:9px;margin-bottom:4px}
.pp-linha span{flex:1;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp-linha small{color:var(--mut);font-weight:500}
.pp-linha.primeiro{border-color:#f2a33a;background:rgba(242,163,58,.1)}
.pp-linha.falando{border-color:#3fbf5f;background:rgba(63,191,95,.12)}
.pp-mini{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:12px;white-space:nowrap}
.pp-mini.ok{background:#3fbf5f;color:#fff;border-color:#3fbf5f}.pp-mini.alerta{background:#e5484d;color:#fff;border-color:#e5484d}
.pp-vazio{color:var(--mut);padding:4px 2px}
.pp-det{margin-top:8px}.pp-det summary{cursor:pointer;font-weight:700;color:var(--mut);margin-bottom:4px}
@media (max-width:760px){#palcoPainel{left:8px;right:8px;width:auto;bottom:118px;max-height:40vh}}
/* ---- telão de projeção ---- */
#btnProj{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:12;padding:11px 16px;font-weight:800;font-size:14px;background:#3d5afe;color:#fff;border-color:#3d5afe;white-space:nowrap}
#btnProj.parar{background:#e5484d;border-color:#e5484d}
#btnProj:disabled{background:var(--panel);color:var(--ink);border-color:var(--line);opacity:1;cursor:default}
.proj-bg{position:fixed;inset:0;z-index:60;background:rgba(8,6,14,.82);display:grid;place-items:center;padding:16px}
.proj-win{width:min(1200px,100%);background:#14121c;border:1px solid #2e2b3a;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;max-height:100%}
.proj-top{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;border-bottom:1px solid #2e2b3a;font-size:14px}
.proj-top b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-status{color:#ff8a8f;font-size:12px;font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-btn{color:#fff;background:#2a2736;border:1px solid #3a3648;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.proj-btn:hover{background:#353145}
.proj-palco{position:relative;background:#000;aspect-ratio:16/9;max-height:calc(100vh - 110px);width:100%}
.proj-palco video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.proj-vazio{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#cfcbd9;font-weight:650;padding:20px}
.proj-vazio small{color:#8f8a9e;font-weight:500}
.proj-palco:fullscreen{max-height:none;aspect-ratio:auto}
@media (max-width:760px){.proj-btn[data-cheia]{font-size:0;padding:6px 9px}.proj-btn[data-cheia]::before{content:"⛶";font-size:15px}}
/* ---- configurações de áudio ---- */
.cfg-sec{margin:4px 0 14px}
.cfg-sec>b{display:block;font-size:13px;margin:0 0 6px}
.cfg-sec select{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 10px;font-size:14px}
.cfg-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.cfg-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.medidor{height:8px;border-radius:5px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.medidor i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbf5f,#c9d13f 70%,#e5484d);transition:width .06s}
.cfg-nota{font-size:12px;color:var(--mut);margin-top:6px}
.pessoa{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;align-items:center}
.pessoa.foco{border-color:var(--brand);box-shadow:0 0 0 2px rgba(61,90,254,.25)}
.pessoa .nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pessoa .nm small{color:var(--mut);font-weight:500}
.pessoa .ctl{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.pessoa input[type=range]{flex:1;accent-color:var(--brand)}
.pessoa .pct{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:650}
.pessoa .mute{width:34px;height:30px;border-radius:8px;background:var(--chip);border:1px solid var(--line)}
.pessoa .mute.on{background:#e5484d;color:#fff;border-color:#e5484d}
.pessoa .reset{font-size:12px;color:var(--brand);font-weight:650}
#btnCfgAudio{padding:9px 10px}
#load{position:fixed;inset:0;display:grid;place-items:center;color:#fff;z-index:50;background:#16141f;font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <div class="pill" id="sala">Carregando…</div>
  <button class="pill" id="eu" aria-label="Menu"><canvas id="mini" class="px" width="32" height="32"></canvas><span id="nome"></span></button>
</div>
<div class="zoom pill"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button></div>
<div class="emotes pill">
  <button id="btnAudio" style="background:#3d5afe;color:#fff">🎧 Ligar áudio</button><button id="btnCfgAudio" title="Microfone, saída de áudio e volume de cada pessoa" aria-label="Configurar áudio">⚙️</button><button id="btnMont">🛴 Patinete</button><button id="btnMao" style="display:none">✋ Levantar a mão</button><button data-emote="5">👋 Acenar</button><button data-emote="6">💃 Dançar</button><button data-emote="4">🪑 Sentar/levantar</button>
</div>
<button class="pill" id="btnProj"></button>
<button class="pill" id="btnTelao" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:12;padding:11px 16px;font-weight:800;font-size:14px;background:#3d5afe;color:#fff;border-color:#3d5afe">📊 Abrir telão</button>
<div id="hint">Setas/WASD ou clique para andar · pare perto de uma cadeira para sentar</div>
<div id="joy"><div id="knob"></div></div>
<aside id="menu" class="sheet hidden"></aside>
<aside id="audioCfg" class="sheet hidden" aria-label="Configurações de áudio"></aside>
<div id="toast"></div>
<div id="load">Entrando no escritório…</div>
<script src="assets.js"></script>
<script src="js/projecao.js"></script>
<script src="js/ti.js"></script>
<script src="js/edicao.js"></script>
<script src="js/icones-lucide.js"></script>
<script src="js/video.js"></script>
<script src="js/palco.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/dados.js"></script>
<script src="js/acesso.js"></script>
<script src="js/mapa-core.js"></script>
<script src="js/avatar.js"></script>
<script src="js/vida.js"></script>
<script src="js/montaria.js"></script>
<script src="js/telao.js"></script>
<script src="js/sala.js"></script>
<script src="js/voz.js"></script>
<script>
let EMAIL = null;
window.OCULTAR_PESSOAS = true; // no escritório só aparecem pessoas de verdade
let S = null, grid = null, user = null, assentos = [];
const mapaId = "principal";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let DPR = 1, VW = 0, VH = 0, zoom = innerWidth <= 760 ? 1.6 : 2;
let P = null, tarefas = [], teloes = [], monitores = []; const outros = []; // outras pessoas (entram aqui quando houver modo com várias pessoas)
const keys = new Set(); let joyV = null;

function resize(){ DPR = Math.min(devicePixelRatio || 1, 2); VW = innerWidth; VH = innerHeight; cv.width = VW*DPR; cv.height = VH*DPR; }
addEventListener("resize", resize); resize();

    Dados.registrarAtividade(EMAIL, "conversa", `Conversou com ${o.nome}${P.sala ? " em " + P.sala : ""}`, {sala: P.sala, com: o.nome});
  });
  telaoPerto = teloes.find(it => dentroDoTelao(it) && Math.hypot(it.x*T + 96 - P.px, it.y*T + 96 - P.py) < 120) || null;
  if (Telao.aberto && telaoSalaAberta && salaAtualId() !== telaoSalaAberta){ telaoSalaAberta = null; Telao.fechar(); toast("Você saiu da sala: o telão foi fechado"); }
  TI.atualizar(); Edicao.atualizar();
  const perto = !!telaoPerto;
  const bt = document.getElementById("btnTelao"); const mostra = perto && !Telao.aberto ? "block" : "none"; if (bt.style.display !== mostra) bt.style.display = mostra;
  for (const a of [P, ...visiveis]){ a.vozReal = now - (a.vozAtiva || -1e9) < 350; if (Voz.ligado) a.falando = a.vozReal; else if (a.vozReal) a.falando = true; }
  checarSala(false);
  if (sujo && now - ultimoSave > 4000){ salvarPos(); ultimoSave = now; }
  if (marca){ marca.t -= dt*1.5; if (marca.t <= 0) marca = null; }
  draw();
  requestAnimationFrame(loop);
}
function salvarPos(){ if (!P) return; sujo = false; const v = P.assento && P.volta ? P.volta : P;
  Dados.salvarPosicao(EMAIL, {mapa: mapaId, x: Math.round(v.x), y: Math.round(v.y), direcao: P.dir}); }
addEventListener("pagehide", () => { salvarPos(); Projecao.parar(false); });
document.addEventListener("visibilitychange", () => { if (document.hidden) salvarPos(); });
function checarSala(first){
  const r = roomAt(P.px, P.py - 4);
  const nome = r ? r.name : "Área externa";
  if (nome === P.sala && !first) return;
  P.sala = nome;
  const z = Voz.zona(P), regra = z.tipo === "fechada" ? " · 🔊 todos da sala se ouvem" : z.tipo === "silencio" ? " · 🤫 sem áudio" : " · 🗣 ouve quem está perto";
  document.getElementById("sala").textContent = "📍 " + nome + regra;
  if (!first) Dados.registrarAtividade(EMAIL, "sala", `Entrou em ${nome}`, {sala: nome});
}
function cam(){
  const W = S.w*T*zoom, H = S.h*T*zoom;
  let ox = VW/2 - P.px*zoom, oy = VH/2 - (P.py - 20)*zoom;
  if (W > VW) ox = Math.min(0, Math.max(VW - W, ox)); else ox = (VW - W)/2;
  if (H > VH) oy = Math.min(0, Math.max(VH - H, oy)); else oy = (VH - H)/2;
  return {ox: Math.round(ox), oy: Math.round(oy)};
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = "#16141f"; ctx.fillRect(0, 0, cv.width, cv.height);
  const c = cam(), atores = [P, ...outros.filter(o => o.visto && o.sheet)];
  const ligados = new Set(monitoresTI); for (const a of atores) if (a.assento && a.assento.trabalho) for (const m of a.assento.monitores) ligados.add(m.x + "," + m.y);
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(zoom*DPR, 0, 0, zoom*DPR, c.ox*DPR, c.oy*DPR);
  drawWorld(ctx, atores.map(a => ({ sort: a.sort(), draw: g => a.draw(g, t) })).concat(teloes.map(it => ({ sort: sortKey(it) + 0.01, draw: g => { const r = salaDoTelao(it); if (!dentroDoTelao(it)){ telaoTrancado(g, it.x*T, it.y*T, r); return; } Telao.desenharTela(g, it.x*T, it.y*T, r ? Telao.filtrarSala(tarefas, r.id, salaPadrao()) : tarefas, r ? "TELÃO · " + r.name.toUpperCase() : "TELÃO DA EQUIPE"); } })))
    .concat(monitores.map(it => ({ sort: sortKey(it) + 0.01, draw: g => desenharMonitor(g, it, ligados.has(it.x + "," + it.y), t) })))
    .concat(Projecao.desenhaveis()).concat(TI.desenhaveis(t)).concat(Edicao.desenhaveis()));
  for (const a of atores) a.balao(ctx, t);
  if (marca){ ctx.strokeStyle = `rgba(61,90,254,${marca.t})`; ctx.lineWidth = 2/zoom*1.5; ctx.beginPath(); ctx.ellipse(marca.x, marca.y, 10*(1.6-marca.t*.6), 5*(1.6-marca.t*.6), 0, 0, Math.PI*2); ctx.stroke(); }
  // nomes (tela)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const a of atores){
    const naMesa = a.assento && a.assento.trabalho;
    const sx = a.px*zoom + c.ox, top = a.assento ? a.assento.sy - 40 : a.y - 45, sy = naMesa ? (a.assento.sy + 14)*zoom + c.oy + 19 : (top - 2)*zoom + c.oy;
    if (sx < -60 || sx > VW + 60 || sy < -40 || sy > VH + 40) continue;
    const vp = a !== P ? (a.volPessoal ?? Voz.volumePessoa(a.id)) : 1;
    const est = a !== P && Voz.ligado && !a.ouvindo && a.estadoAudio === "conectando" ? " ⏳" : "";
    const semMic = a !== P && a.audio !== false && a.mic === false && a.visto ? " 🎙️✕" : "";
    const tela = a === P ? Projecao.minhaTela : a.tela;
    const mao = a === P ? Palco.mao : a.mao;
    if (mao){ // mão levantada em cima da pessoa
      const by = sy - 46 - Math.abs(Math.sin(t*4))*3;
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#f2a33a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(sx - 15, by, 30, 26, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 5, by + 26); ctx.lineTo(sx, by + 32); ctx.lineTo(sx + 5, by + 26); ctx.fill();
      ctx.font = "17px system-ui,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#000"; ctx.fillText("✋", sx, by + 14); ctx.textAlign = "left";
    }
    const txt = a.nome + (tela ? " 🖥️" : "") + (vp === 0 ? " 🔇" : a !== P && a.ouvindo ? " 🔊" : "") + est + semMic + (vp > 0 && vp < 0.99 ? ` ${Math.round(vp*100)}%` : vp > 1.01 ? ` ${Math.round(vp*100)}%` : "") + (a.vozReal ? " 🗣" : "");
    ctx.font = "700 12px system-ui,sans-serif"; const w = ctx.measureText(txt).width + 12;
    ctx.fillStyle = a === P ? "rgba(61,90,254,.92)" : "rgba(20,16,32,.72)"; ctx.beginPath(); ctx.roundRect(sx - w/2, sy - 19, w, 17, 6); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, sx, sy - 10.5); ctx.textAlign = "left";
  }
  TI.nomes(ctx, c, zoom, t);
  // selo de sala com senha/restrita
  for (const r of S.rooms){
    const selo = Acesso.selo(r); if (!selo) continue;
    const sx = (r.x*T + 6)*zoom + c.ox, sy = (r.y*T + 6)*zoom + c.oy;
    if (sx < -200 || sx > VW + 20 || sy < -20 || sy > VH + 20) continue;
    const ok = Acesso.podeEntrar(r), txt = `${selo === "senha" ? "🔑" : "🔒"} ${r.name}${ok ? " · liberada p/ você" : ""}`;
    ctx.font = "700 11px system-ui,sans-serif"; const w = ctx.measureText(txt).width + 12;
    ctx.fillStyle = ok ? "rgba(63,191,95,.9)" : "rgba(229,72,77,.9)"; ctx.beginPath(); ctx.roundRect(sx, sy, w, 17, 6); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(txt, sx + 6, sy + 9);
  }
}

/* ---------- menu ---------- */

document.getElementById("eu").onclick = async () => {
  if (!menu.classList.contains("hidden")) { menu.classList.add("hidden"); return; }
  fecharConfigAudio();
  const acts = await Dados.listarAtividades(EMAIL, 40);
  const ico = {cadastro:"✨", entrou:"🚪", saiu:"👋", avatar:"🧍", sala:"📍", acao:"🎉", editor:"🛠️", conversa:"💬", tarefa:"✅", telao:"📊"};
  menu.innerHTML = `<h3>${esc(user.nome)} <button class="x" data-close aria-label="Fechar">×</button></h3>
    <div style="color:var(--mut);font-size:13px;margin:-6px 0 8px">${esc(user.email)} · ${Sala.online} online agora</div>
    <a class="mi" href="avatar.html">🧍 Editar meu personagem</a>
    <button class="mi" data-telao>📊 Telão da equipe</button>

    <button class="mi" data-edicao>🎬 Roteiros (Edição)</button>

menu.onclick = async e => {
  if (e.target.closest("[data-close]")) menu.classList.add("hidden");

  if (e.target.closest("[data-cfgaudio]")) { menu.classList.add("hidden"); abrirConfigAudio(); }
  if (e.target.closest("[data-tend]")) { menu.classList.add("hidden"); TI.abrirPainel(); }
  if (e.target.closest("[data-edicao]")) { menu.classList.add("hidden"); Edicao.abrirPainel(); }

  if (e.target.closest("[data-exp]")) {

    const blob = new Blob([JSON.stringify(dados, null, 2)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `meus-dados-${EMAIL}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
};

/* ---------- configurações de áudio (dispositivos e volume de cada pessoa) ---------- */
const cfg = document.getElementById("audioCfg");
let cfgFoco = null, cfgTeste = null, cfgRaf = 0, cfgAberto = false;
async function abrirConfigAudio(foco){
  cfgFoco = foco || null;
  document.getElementById("menu").classList.add("hidden");
  cfgAberto = true; cfg.classList.remove("hidden");
  await renderConfigAudio();
  if (cfgFoco){ const el = cfg.querySelector(`[data-pessoa="${CSS.escape(cfgFoco)}"]`); if (el) el.scrollIntoView({block: "center", behavior: "smooth"}); }
  iniciarMedidor();
}
function fecharConfigAudio(){
  if (!cfgAberto) return; cfgAberto = false;
  cfg.classList.add("hidden"); cancelAnimationFrame(cfgRaf);
  if (cfgTeste){ cfgTeste.parar(); cfgTeste = null; }
}
async function iniciarMedidor(){
  if (cfgTeste){ cfgTeste.parar(); cfgTeste = null; }
  cancelAnimationFrame(cfgRaf);
  const barra = cfg.querySelector(".medidor i"); if (!barra) return;
  cfgTeste = await Voz.testeMic(); if (!cfgTeste || !cfgAberto){ if (cfgTeste && !cfgAberto){ cfgTeste.parar(); cfgTeste = null; } return; }
  const passo = () => { if (!cfgAberto) return; const n = cfgTeste ? cfgTeste.nivel() : 0; barra.style.width = Math.min(100, n*260) + "%"; cfgRaf = requestAnimationFrame(passo); };
  passo();
}
async function renderConfigAudio(){
  const d = await Voz.dispositivos(), pf = Voz.pref;
  const ops = (lista, sel) => `<option value="">Padrão do sistema</option>` +
    lista.filter(x => !x.padrao && x.id !== "communications").map(x => `<option value="${esc(x.id)}"${x.id === sel ? " selected" : ""}>${esc(x.nome)}</option>`).join("");
  const pessoas = outros.filter(o => o.visto).sort((a, b) => (b.ouvindo ? 1 : 0) - (a.ouvindo ? 1 : 0) || a.nome.localeCompare(b.nome));
  const max = Math.round(d.volumeMax * 100);
  cfg.innerHTML = `<h3>🎚️ Áudio <button class="x" data-close aria-label="Fechar">×</button></h3>
    ${d.temNomes ? "" : `<div class="cfg-sec"><button class="btn pri" data-permitir style="width:100%">Permitir microfone para ver os dispositivos</button>
      <div class="cfg-nota">O navegador só mostra o nome dos microfones e fones depois que você permite o acesso.</div></div>`}
    <div class="cfg-sec"><b>🎙️ Microfone (entrada)</b>
      <select data-mic>${ops(d.entradas, pf.mic)}</select>
      <div class="medidor" title="Fale para testar"><i></i></div>
      <div class="cfg-row"><label><input type="checkbox" data-ruido ${pf.ruido ? "checked" : ""}> Redução de ruído</label><label><input type="checkbox" data-eco ${pf.eco ? "checked" : ""}> Cancelar eco</label></div>
      ${Voz.ligado && Voz.micAtual ? `<div class="cfg-nota">Usando agora: ${esc(Voz.micAtual)}</div>` : ""}
    </div>
    <div class="cfg-sec"><b>🎧 Saída de áudio (fone ou caixa)</b>
      ${d.podeEscolherSaida ? `<select data-saida>${ops(d.saidas, pf.saida)}</select>` : `<div class="cfg-nota">Este navegador não deixa escolher a saída: o som vai para a saída padrão do sistema. No Chrome ou Edge dá para escolher.</div>`}
      <div class="cfg-row"><button class="btn" data-testar>🔔 Testar som</button></div>
    </div>
    <div class="cfg-sec"><b>👥 Volume de cada pessoa <small style="color:var(--mut);font-weight:500">· só para você</small></b>
      ${pessoas.length ? pessoas.map(o => {
        const v = Math.round(Voz.volumePessoa(o.id) * 100);
        return `<div class="pessoa${o.id === cfgFoco ? " foco" : ""}" data-pessoa="${esc(o.id)}">
          <div class="nm">${esc(o.nome)} <small>${o.ouvindo ? "· 🔊 ouvindo agora" : "· longe"}</small></div>
          ${v !== 100 ? `<button class="reset" data-reset>voltar a 100%</button>` : "<span></span>"}
          <div class="ctl"><button class="mute${v === 0 ? " on" : ""}" data-mute title="${v === 0 ? "Voltar a ouvir" : "Silenciar só para mim"}">${v === 0 ? "🔇" : "🔈"}</button>
            <input type="range" min="0" max="${max}" step="5" value="${Math.min(v, max)}" data-vol aria-label="Volume de ${esc(o.nome)}"><span class="pct">${v}%</span></div>
        </div>`; }).join("") : `<div class="cfg-nota">Ninguém mais no escritório agora. Quando alguém entrar, o volume dele aparece aqui — ou clique no personagem da pessoa no mapa.</div>`}
      <div class="cfg-nota">Dica: clique em alguém no mapa para ajustar o volume dessa pessoa. ${d.volumeMax > 1 ? "Dá para subir até 200%." : "Neste navegador o máximo é 100%."}</div>
    </div>`;
}
const ultimoVol = {};
cfg.addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) { fecharConfigAudio(); return; }
  if (e.target.closest("[data-permitir]")) { if (await Voz.pedirPermissao()) { await renderConfigAudio(); iniciarMedidor(); } else toast("O navegador bloqueou o microfone"); return; }
  if (e.target.closest("[data-testar]")) { Voz.testarSaida(); return; }
  const linha = e.target.closest("[data-pessoa]"); if (!linha) return;
  const id = linha.dataset.pessoa, atual = Voz.volumePessoa(id);
  if (e.target.closest("[data-mute]")) {
    if (atual > 0){ ultimoVol[id] = atual; Voz.definirVolumePessoa(id, 0); }
    else Voz.definirVolumePessoa(id, ultimoVol[id] || 1);
  } else if (e.target.closest("[data-reset]")) Voz.definirVolumePessoa(id, 1);
  else return;
  cfgFoco = id; await renderConfigAudio(); iniciarMedidor();
});
cfg.addEventListener("input", e => {
  const r = e.target.closest("[data-vol]"); if (!r) return;
  const linha = r.closest("[data-pessoa]"), v = +r.value;
  Voz.definirVolumePessoa(linha.dataset.pessoa, v / 100);
  linha.querySelector(".pct").textContent = v + "%";
  const m = linha.querySelector("[data-mute]"); m.classList.toggle("on", v === 0); m.textContent = v === 0 ? "🔇" : "🔈";
});
cfg.addEventListener("change", async e => {
  if (e.target.matches("[data-mic]")) {
    const r = await Voz.trocarMic(e.target.value);
    toast(r.ok ? (Voz.ligado ? "Microfone trocado" : "Microfone salvo — vale ao ligar o áudio") : "Não consegui usar esse microfone");
    atualizarBotaoAudio(); await renderConfigAudio(); iniciarMedidor();
  } else if (e.target.matches("[data-saida]")) {
    const ok = await Voz.aplicarSaida(e.target.value);
    toast(ok ? "Saída de áudio trocada" : "Não consegui usar essa saída"); if (ok) Voz.testarSaida();
  } else if (e.target.matches("[data-ruido],[data-eco]")) {
    await Voz.processamento({ ruido: cfg.querySelector("[data-ruido]").checked, eco: cfg.querySelector("[data-eco]").checked });
    toast("Ajuste do microfone aplicado"); iniciarMedidor();
  }
});
addEventListener("voz:dispositivos", () => { if (cfgAberto) renderConfigAudio().then(iniciarMedidor); });

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
let toastT = null;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); }
</script>
