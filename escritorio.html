<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escritório – Next Co.</title>
<link rel="stylesheet" href="css/base.css">
<style>
html,body{height:100%;overflow:hidden}
/* ---- direção de arte do HUD: vidro escuro da marca, Inter, ícones Lucide ---- */
@font-face{font-family:Inter;font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:800;src:url(assets/fonts/inter-latin-800-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:900;src:url(assets/fonts/inter-latin-900-normal.woff2) format("woff2");font-display:swap}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.hud{background:rgba(22,20,31,.74);color:#fff;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-radius:14px}
.hud button{color:#fff}
.ic{flex:none;display:block}
.emotes.hud{padding:6px;gap:4px;border-radius:18px}
.emotes.hud button{display:flex;align-items:center;gap:7px;border-radius:12px;padding:10px 13px;font-weight:800;font-size:13px;transition:background .15s,transform .1s}
.emotes.hud button:hover{background:rgba(255,255,255,.09)}
.emotes.hud button:active{transform:scale(.96);background:rgba(255,255,255,.14)}
.emotes.hud #btnAudio{background:#3d5afe;box-shadow:0 4px 14px rgba(61,90,254,.45)}
.emotes.hud #btnAudio.mudo{background:#e5484d!important;box-shadow:0 4px 14px rgba(229,72,77,.4)}
.emotes.hud .div{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.12);flex:none}
#sala.hud{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 11px;font-weight:800}
#sala.hud .ic{color:#8a9bff}
#sala.hud small{font-weight:600;color:rgba(255,255,255,.62);font-size:12.5px}
#eu.hud{padding:5px 12px 5px 5px;font-weight:800}
#eu.hud canvas{background:#2a2540;border-radius:10px}
.zoom.hud{border-radius:14px}
.zoom.hud button{display:grid;place-items:center}
#b3d{font-weight:900;font-size:12px}
#b3d.on{background:#3d5afe}
.zoom.hud button:hover{background:rgba(255,255,255,.08)}
#hint.hud{font-weight:600;font-size:12.5px;padding:8px 12px;transition:opacity .6s}
#btnTelao.hud,#btnProj.hud{display:flex;align-items:center;gap:8px}
@media (max-width:760px){
  .emotes.hud button span{display:none}
  .emotes.hud button{padding:11px}
  .emotes.hud #btnAudio span{display:inline}
  #sala.hud small{display:none}
}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;z-index:10;pointer-events:none}
.top>*{pointer-events:auto}
#sala{padding:9px 13px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
#eu{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;font-weight:650;font-size:14px}
#eu canvas{width:30px;height:30px;border-radius:8px;background:#cfc7b6}
.zoom{position:fixed;right:8px;top:62px;display:flex;flex-direction:column;z-index:10;overflow:hidden}
.zoom button{width:42px;height:42px;font-size:20px;font-weight:700}
.emotes{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;z-index:10;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.emotes button{padding:9px 12px;border-radius:9px;font-weight:650;font-size:13px;white-space:nowrap}
.emotes button:active{background:var(--chip)}
#btnAudio.mudo{background:#e5484d!important}
@media (max-width:760px){.emotes button{padding:8px 9px;font-size:12px}}
#hint{position:fixed;left:8px;top:62px;z-index:9;font-size:12px;color:#fff;background:rgba(20,16,32,.7);padding:6px 10px;border-radius:9px;pointer-events:none}
#joy{position:fixed;left:22px;bottom:84px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);z-index:11;display:none;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sheet{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:auto;transition:transform .18s ease}
@media (max-width:760px){.sheet{left:0;right:0;bottom:0;max-height:70vh;border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}.sheet.hidden{transform:translateY(105%)}#sala{max-width:42vw}}
@media (min-width:761px){.sheet{top:60px;right:60px;width:340px;max-height:calc(100vh - 130px);border-radius:14px;padding:14px}.sheet.hidden{transform:translateX(calc(100% + 90px))}}
.sheet h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;font-size:22px;width:34px;height:34px;border-radius:8px}
.mi{display:flex;width:100%;text-align:left;padding:11px 10px;border-radius:9px;font-weight:600;gap:10px;align-items:center;text-decoration:none;color:inherit}
.mi:hover{background:var(--chip)}
.sep{height:1px;background:var(--line);margin:6px 0}
.act{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.act b{display:block}.act small{color:var(--mut)}
.ico{width:28px;height:28px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* ---- painel de tendências (TI) ---- */
.tend-bg{position:fixed;inset:0;z-index:60;background:rgba(8,6,14,.78);display:grid;place-items:center;padding:14px}
.tend-win{width:min(1100px,100%);height:min(88vh,900px);background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tend-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0f3a44,#13a6b8);color:#fff}
.tend-top>b{font-size:16px;white-space:nowrap}
.tend-agentes{display:flex;gap:6px;overflow-x:auto;flex:1}
.tend-agentes .ag{font-size:12px;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;white-space:nowrap}
.tend-agentes .ag small{opacity:.75}
.tend-agentes .ag.on{background:rgba(92,255,122,.25)}
.tend-x{color:#fff;font-size:18px;width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.2)}
.tend-barra{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tend-barra .tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-weight:650;font-size:13px}
.tend-barra .tab.on{background:#13a6b8;color:#fff;border-color:#13a6b8}
.tend-barra .tab i{font-style:normal;opacity:.7;margin-left:3px}
.tend-barra input{margin-left:auto;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--chip);padding:0 10px;min-width:160px}
.tend-form{display:grid;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--chip)}
.tend-form input,.tend-form textarea,.tend-form select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel)}
.tend-form .row2{display:flex;gap:6px;flex-wrap:wrap}.tend-form .row2 input{flex:1;min-width:140px}
.tend-lista{flex:1;overflow:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;align-content:start}
.tend-vazio{color:var(--mut);grid-column:1/-1;text-align:center;padding:40px 10px}
.tc{border:1px solid var(--line);border-left:4px solid #f2a33a;border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.tc.pega{border-left-color:#3fbf5f}.tc.nao_pega{border-left-color:#e5484d;opacity:.85}
.tc-top{display:flex;gap:8px;align-items:flex-start}.tc-top b{flex:1;font-size:15px;line-height:1.3}
.estrelas{color:#f2a33a;font-size:12px;white-space:nowrap}
.tc-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);align-items:center}
.tc-meta .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink)}
.tc-meta a{color:var(--brand);font-weight:650}
.tc p{margin:0;font-size:13.5px}
.tc-acoes{display:flex;gap:6px;flex-wrap:wrap}
.tc-acoes button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-weight:650;font-size:13px;background:var(--chip)}
.tc-acoes .dec.pega.on{background:#3fbf5f;color:#fff;border-color:#3fbf5f}
.tc-acoes .dec.nao.on{background:#e5484d;color:#fff;border-color:#e5484d}
.tc-acoes .trava.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.tc-acoes .del{margin-left:auto}
/* sala de Edição */
.ed-win .tend-barra .tab.on{background:#e04fa0;border-color:#e04fa0}
.ed-win .tend-barra select{margin-left:auto;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--chip);padding:0 8px;max-width:260px}
.ed-win .tend-lista{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
/* ---------- social: topo, chat, cartão, toque, agenda ---------- */
.soc-topo{display:flex;gap:6px;margin-left:auto;pointer-events:auto}
.soc-topo+#eu{margin-left:0}
.soc-st,.soc-ic{display:flex;align-items:center;gap:7px;padding:8px 11px;font-weight:750;font-size:13px;position:relative}
.soc-ic .soc-ico{display:grid;place-items:center}
.soc-ic .bdg{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font:800 10.5px/18px Inter,system-ui;font-style:normal;text-align:center;padding:0 5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.soc-pop{position:fixed;z-index:60;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.soc-menu{display:flex;flex-direction:column;padding:6px;min-width:210px}
.soc-menu button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-weight:650;text-align:left}
.soc-menu button:hover,.soc-menu button.on{background:var(--chip)}
.soc-menu p{margin:6px 8px 4px;font-size:11.5px;color:var(--mut);max-width:220px}
.soc-card{padding:12px;width:270px}
.sc-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sc-top small{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:12px}
.av{width:30px;height:30px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font:800 11px Inter,system-ui;flex:none}
.sc-acoes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sc-acoes button{padding:9px 6px;border-radius:10px;background:var(--chip);border:1px solid var(--line);font-weight:700;font-size:13px}
.sc-acoes button:hover{border-color:var(--brand)}.sc-acoes .full{grid-column:1/-1}
.soc-toque{position:fixed;z-index:70;left:50%;top:76px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:min(560px,94vw);
  background:var(--panel);color:var(--ink);border:2px solid var(--brand);border-radius:16px;padding:12px 14px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:tqIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tqIn{from{transform:translate(-50%,-14px) scale(.95);opacity:0}}
.tq-ic{font-size:26px;animation:tqSino 1s ease-in-out 3}
@keyframes tqSino{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.tq-tx{flex:1;min-width:180px}.tq-ac{display:flex;gap:6px}.tq-ac .btn{padding:8px 12px;font-size:13px}
.soc-chat{position:fixed;z-index:40;top:64px;right:10px;bottom:84px;width:min(380px,calc(100vw - 20px));display:none;flex-direction:column;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.4);overflow:hidden}
.soc-chat.on{display:flex}
.sc-h{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 14px}.sc-h b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-x{width:30px;height:30px;border-radius:9px;font-size:20px;line-height:1}.sc-x:hover{background:var(--chip)}
.sc-v{font-weight:700;color:var(--brand);font-size:13px}
.sc-abas{display:flex;gap:4px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.sc-abas button{padding:6px 11px;border-radius:999px;font-weight:700;font-size:12.5px;background:var(--chip);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.sc-abas button.on{background:var(--brand);color:#fff}
.sc-abas i,.soc-dms i{font-style:normal;background:#e5484d;color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:3px}
.soc-msgs{flex:1;overflow:auto;padding:8px 12px}
.msg{display:flex;gap:9px;margin-top:10px;position:relative}.msg.junto{margin-top:2px;padding-left:39px}
.msg-c{flex:1;min-width:0}.msg-h{display:flex;gap:8px;align-items:baseline}.msg-h small{color:var(--mut);font-size:11px}
.msg-t{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.4}
.msg-t a{color:var(--brand)}.msg-t .men{color:var(--brand);background:#3d5afe18;border-radius:5px;padding:0 3px}
.msg-x{position:absolute;right:0;top:0;opacity:0;color:var(--mut);width:22px;height:22px;border-radius:6px}.msg:hover .msg-x{opacity:1}
.msg-dia{text-align:center;color:var(--mut);font-size:11.5px;font-weight:700;margin:14px 0 4px;text-transform:capitalize}
.soc-env{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.soc-env textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--ink);padding:10px 12px;font:inherit;font-size:14px;max-height:120px}
.soc-env .btn{padding:0 14px}
.soc-vazio{color:var(--mut);text-align:center;padding:30px 18px;margin:0;font-size:13.5px}
.soc-dms{flex:1;overflow:auto;padding:6px}
.soc-dms button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:11px;text-align:left}
.soc-dms button:hover{background:var(--chip)}.dm-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.dm-tx small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-sep{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:12px 8px 4px}
.soc-modal{position:fixed;inset:0;z-index:55;display:none;place-items:center;background:rgba(10,8,18,.55);padding:16px}
.soc-modal.on{display:grid}
.sm-win{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(620px,100%);max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.sm-h{display:flex;align-items:center;gap:8px;padding:14px 14px 10px 18px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line)}.sm-h b{flex:1;font-size:16px}
.sm-h .btn{padding:8px 12px;font-size:13px}
.ag-lista{padding:4px 16px 16px}
.ag-r{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;opacity:.75}
.ag-r.eu{opacity:1;border-left:4px solid var(--brand)}.ag-r.agora{border-color:#3fbf5f;background:#3fbf5f12}
.ag-h{font-weight:900;font-size:16px;display:flex;flex-direction:column;min-width:52px}.ag-h small{font-weight:600;color:var(--mut);font-size:12px}
.ag-c{flex:1;min-width:0}.ag-c small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}.ag-c p{margin:6px 0 0;font-size:13px}
.ag-tag{font-size:11px;font-weight:800;color:#fff;background:#3fbf5f;border-radius:999px;padding:1px 7px}
.ag-ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ag-ac .btn{padding:7px 11px;font-size:12.5px;text-decoration:none;color:inherit}
.btn.dan{color:#e5484d}
.ag-form{padding:12px 18px 18px;display:flex;flex-direction:column;gap:10px}
.ag-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--mut)}
.ag-form input,.ag-form select,.ag-form textarea{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:0 10px;font:inherit;font-size:14px;font-weight:400}
.ag-form textarea{height:auto;padding:8px 10px;resize:vertical}
.ag-form .row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.ag-conv{display:flex;flex-wrap:wrap;gap:6px}
.ag-conv .chip{flex-direction:row;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;color:var(--ink);cursor:pointer;font-weight:650}
.ag-conv .chip .av{width:22px;height:22px;font-size:9.5px}
.ag-conv input{display:none}.ag-conv .chip:has(input:checked){border-color:var(--brand);background:#3d5afe1c}
.av-lista{padding:8px}
.av-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border-radius:11px}
.av-i:hover{background:var(--chip)}.av-i b{font-weight:600;font-size:13.5px;display:block}.av-i small{color:var(--mut);font-size:11.5px;text-transform:capitalize}
.av-i.novo{background:#3d5afe12}.av-i.novo b{font-weight:800}
@media (max-width:760px){.soc-st span{display:none}.soc-st,.soc-ic{padding:8px 9px}.soc-chat{top:58px;bottom:76px}.ag-form .row3{grid-template-columns:1fr 1fr}}
/* ---------- painel do gestor ---------- */
.gs-win{width:min(980px,100%)}
.gs-corpo{padding:12px 18px 18px}
.gs-abas,.gs-per{display:flex;gap:4px}
.gs-abas button,.gs-per button{padding:7px 12px;border-radius:999px;background:var(--chip);font-weight:700;font-size:13px}
.gs-abas button.on,.gs-per button.on{background:var(--brand);color:#fff}
.gs-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.gs-barra .btn{padding:7px 12px;font-size:13px}
.gs-on{flex:1;color:var(--mut);font-size:13px;font-weight:650}
.gs-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.gs-cards div{background:var(--chip);border-radius:12px;padding:12px;text-align:center}.gs-cards b{display:block;font-size:22px}.gs-cards small{color:var(--mut);font-size:12px}
.gs-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 0 8px}.gs-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.gs-tab{width:100%;border-collapse:collapse;font-size:13px}
.gs-tab th{text-align:left;color:var(--mut);font-weight:700;font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
.gs-tab td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.gs-tab td:first-child{display:flex;align-items:center;gap:8px}
.gs-n{display:flex;flex-direction:column}.gs-n small{color:var(--mut);font-size:11.5px;display:flex;align-items:center;gap:4px}
.gs-bar{width:30%}.gs-bar>div{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--chip)}.gs-bar i,.gs-col i{display:block}
.gs-alerta{background:#e5484d14}.gs-alerta .gs-n small{color:#e5484d;font-weight:700}
.gs-dias{display:flex;align-items:flex-end;gap:6px;height:150px;padding:8px 0}
.gs-dia{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.gs-dia small{color:var(--mut);font-size:11px;text-transform:uppercase}

  // telas vivas (telões, monitores, projeção, tendências, roteiros): as mesmas no 2D e no 3D
  const telasVivas = teloes.map(it => ({ sort: sortKey(it) + 0.01, draw: g => { const r = salaDoTelao(it); if (!dentroDoTelao(it)){ telaoTrancado(g, it.x*T, it.y*T, r); return; } Telao.desenharTela(g, it.x*T, it.y*T, r ? Telao.filtrarSala(tarefas, r.id, salaPadrao()) : tarefas, r ? "TELÃO · " + r.name.toUpperCase() : "TELÃO DA EQUIPE"); } }))
    .concat(monitores.map(it => ({ sort: sortKey(it) + 0.01, draw: g => desenharMonitor(g, it, ligados.has(it.x + "," + it.y), t) })))
    .concat(Projecao.desenhaveis()).concat(TI.desenhaveis(t)).concat(Edicao.desenhaveis());
  ctx.imageSmoothingEnabled = false;
  if (tres){
    if (Iso3D.luzes) Iso3D.luzes(luzApagada);
    Iso3D.render(atores, telasVivas, t, zoom, P, dtQuadro);
    const umaP = Iso3D.primeiraPessoa;
    for (const a of atores){ if (umaP && a === P) continue; const k = Math.min(2.4, Iso3D.escalaEm ? Iso3D.escalaEm(a.px, a.py) : Iso3D.escala()); if (!k) continue; const [fx, fy] = Iso3D.tela(a.px, a.py, 0); ctx.setTransform(DPR*k, 0, 0, DPR*k, DPR*(fx - a.px*k), DPR*(fy - a.py*k)); a.balao(ctx, t); }
  } else {
    ctx.setTransform(zoom*DPR, 0, 0, zoom*DPR, c.ox*DPR, c.oy*DPR);
    drawWorld(ctx, atores.map(a => ({ sort: a.sort(), draw: g => a.draw(g, t) })).concat(telasVivas));
    desenharEscuro();
    desenharLuz(ligados);
    for (const a of atores) a.balao(ctx, t);
    if (marca){ ctx.strokeStyle = `rgba(61,90,254,${marca.t})`; ctx.lineWidth = 2/zoom*1.5; ctx.beginPath(); ctx.ellipse(marca.x, marca.y, 10*(1.6-marca.t*.6), 5*(1.6-marca.t*.6), 0, 0, Math.PI*2); ctx.stroke(); }
  }
  // nomes (tela)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!tres) vinheta();
  for (const a of atores){
    if (tres && Iso3D.primeiraPessoa && (a === P || Math.hypot(a.px - P.px, a.py - P.py) > 22*T)) continue; // na 1ª pessoa: sem o seu nome e sem nomes muito longe
    const naMesa = a.assento && a.assento.trabalho;
    let sx, sy;
    if (tres) [sx, sy] = Iso3D.tela(a.px, a.py, a.assento ? 46 : 54);
    else { sx = a.px*zoom + c.ox; const top = a.assento ? a.assento.sy - 40 : a.y - 45; sy = naMesa ? (a.assento.sy + 14)*zoom + c.oy + 19 : (top - 2)*zoom + c.oy; }
    if (sx < -60 || sx > VW + 60 || sy < -40 || sy > VH + 40) continue;
    const vp = a !== P ? (a.volPessoal ?? Voz.volumePessoa(a.id)) : 1;
    const est = a !== P && Voz.ligado && !a.ouvindo && a.estadoAudio === "conectando" ? " ⏳" : "";
    const semMic = a !== P && a.audio !== false && a.mic === false && a.visto ? " 🎙️✕" : "";
    const tela = a === P ? Projecao.minhaTela : a.tela;
    const mao = a === P ? Palco.mao : a.mao;
    if (mao){ // mão levantada em cima da pessoa
      const by = sy - 46 - Math.abs(Math.sin(t*4))*3;
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#f2a33a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(sx - 15, by, 30, 26, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 5, by + 26); ctx.lineTo(sx, by + 32); ctx.lineTo(sx + 5, by + 26); ctx.fill();
      iconeCanvas(ctx, "hand", sx, by + 13, 18, "#d48a12");
    }
    // etiqueta: nome + volume pessoal em texto; estados de áudio/tela como ícones (Lucide)
    const txt = a.nome + (vp > 0 && vp < 0.99 || vp > 1.01 ? ` ${Math.round(vp*100)}%` : "");
    const icones = [];
    if (a.vozReal) icones.push(["mic", "#7ee787"]);
    if (tela) icones.push(["monitor", "#8a9bff"]);
    if (vp === 0) icones.push(["volume-x", "#ff8a8a"]); else if (a !== P && a.ouvindo) icones.push(["volume-1", "rgba(255,255,255,.75)"]);
    if (est) icones.push(["loader-circle", "#f2c97a"]);
    if (semMic) icones.push(["mic-off", "#ff8a8a"]);
    ctx.font = "800 12px Inter,system-ui,sans-serif"; const wt = ctx.measureText(txt).width, w = wt + 16 + icones.length*15;
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.fillStyle = a === P ? "rgba(61,90,254,.95)" : "rgba(22,20,31,.82)"; ctx.beginPath(); ctx.roundRect(sx - w/2, sy - 20, w, 19, 9); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(txt, sx - w/2 + 8, sy - 10);
    const stA = a === P ? Social.status : a.status; // bolinha de status
    if (stA && stA !== "disponivel"){ ctx.fillStyle = (Social.STATUS[stA] || {}).cor || "#9aa0ad"; ctx.strokeStyle = "#16141f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx - w/2 + 2, sy - 18, 4.5, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
    if (a.falaChat && performance.now() < a.falaChatAte){ // balão com a última mensagem do chat
      const msg = a.falaChat.length > 46 ? a.falaChat.slice(0, 44) + "…" : a.falaChat;
      ctx.font = "600 12px Inter,system-ui,sans-serif"; const bw = Math.min(260, ctx.measureText(msg).width + 18), by = sy - 50 - (mao ? 34 : 0);
      ctx.save(); ctx.globalAlpha = Math.min(1, (a.falaChatAte - performance.now())/600);
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(sx - bw/2, by, bw, 24, 10); ctx.fill(); ctx.beginPath(); ctx.moveTo(sx - 5, by + 24); ctx.lineTo(sx, by + 30); ctx.lineTo(sx + 5, by + 24); ctx.fill();
      ctx.fillStyle = "#1d1d1f"; ctx.textAlign = "center"; ctx.fillText(msg, sx, by + 12.5, bw - 12); ctx.restore(); ctx.textAlign = "left";
    }
    icones.forEach(([nm, cor], i) => iconeCanvas(ctx, nm, sx - w/2 + 8 + wt + 9 + i*15, sy - 10.5, 12, cor));
  }
  if (!tres) TI.nomes(ctx, c, zoom, t);
  // selo de sala com senha/restrita
  if (!(tres && Iso3D.primeiraPessoa)) for (const r of S.rooms){
    const selo = Acesso.selo(r); if (!selo) continue;
    const [sx, sy] = tres ? Iso3D.tela(r.x*T + 6, r.y*T + 6, 80) : [(r.x*T + 6)*zoom + c.ox, (r.y*T + 6)*zoom + c.oy];
    if (sx < -200 || sx > VW + 20 || sy < -20 || sy > VH + 20) continue;
    const ok = Acesso.podeEntrar(r), txt = `${r.name}${ok ? " · liberada para você" : ""}`;
    ctx.font = "800 11px Inter,system-ui,sans-serif"; const w = ctx.measureText(txt).width + 30;
    ctx.fillStyle = ok ? "rgba(46,158,76,.92)" : "rgba(229,72,77,.92)"; ctx.beginPath(); ctx.roundRect(sx, sy, w, 20, 10); ctx.fill();
    iconeCanvas(ctx, selo === "senha" ? "key" : "lock", sx + 12, sy + 10, 13, "#fff");
    ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(txt, sx + 22, sy + 10.5);
  }
}

/* ---------- configurações de áudio (dispositivos e volume de cada pessoa) ---------- */
const cfg = document.getElementById("audioCfg");
let cfgFoco = null, cfgTeste = null, cfgRaf = 0, cfgAberto = false;
async function abrirConfigAudio(foco){
  cfgFoco = foco || null;
  document.getElementById("menu").classList.add("hidden");
  cfgAberto = true; cfg.classList.remove("hidden");
  await renderConfigAudio();
  if (cfgFoco){ const el = cfg.querySelector(`[data-pessoa="${CSS.escape(cfgFoco)}"]`); if (el) el.scrollIntoView({block: "center", behavior: "smooth"}); }
  iniciarMedidor();
}
function fecharConfigAudio(){
  if (!cfgAberto) return; cfgAberto = false;
  cfg.classList.add("hidden"); cancelAnimationFrame(cfgRaf);
  if (cfgTeste){ cfgTeste.parar(); cfgTeste = null; }
}
async function iniciarMedidor(){
  if (cfgTeste){ cfgTeste.parar(); cfgTeste = null; }
  cancelAnimationFrame(cfgRaf);
  const barra = cfg.querySelector(".medidor i"); if (!barra) return;
  cfgTeste = await Voz.testeMic(); if (!cfgTeste || !cfgAberto){ if (cfgTeste && !cfgAberto){ cfgTeste.parar(); cfgTeste = null; } return; }
  const passo = () => { if (!cfgAberto) return; const n = cfgTeste ? cfgTeste.nivel() : 0; barra.style.width = Math.min(100, n*260) + "%"; cfgRaf = requestAnimationFrame(passo); };
  passo();
}
async function renderConfigAudio(){
  const d = await Voz.dispositivos(), pf = Voz.pref;
  const ops = (lista, sel) => `<option value="">Padrão do sistema</option>` +
    lista.filter(x => !x.padrao && x.id !== "communications").map(x => `<option value="${esc(x.id)}"${x.id === sel ? " selected" : ""}>${esc(x.nome)}</option>`).join("");
  const pessoas = outros.filter(o => o.visto).sort((a, b) => (b.ouvindo ? 1 : 0) - (a.ouvindo ? 1 : 0) || a.nome.localeCompare(b.nome));
  const max = Math.round(d.volumeMax * 100);
  cfg.innerHTML = `<h3>🎚️ Áudio <button class="x" data-close aria-label="Fechar">×</button></h3>
    ${d.temNomes ? "" : `<div class="cfg-sec"><button class="btn pri" data-permitir style="width:100%">Permitir microfone para ver os dispositivos</button>
      <div class="cfg-nota">O navegador só mostra o nome dos microfones e fones depois que você permite o acesso.</div></div>`}
    <div class="cfg-sec"><b>🎙️ Microfone (entrada)</b>
      <select data-mic>${ops(d.entradas, pf.mic)}</select>
      <div class="medidor" title="Fale para testar"><i></i></div>
      <div class="cfg-row"><label><input type="checkbox" data-ruido ${pf.ruido ? "checked" : ""}> Redução de ruído</label><label><input type="checkbox" data-eco ${pf.eco ? "checked" : ""}> Cancelar eco</label></div>
      ${Voz.ligado && Voz.micAtual ? `<div class="cfg-nota">Usando agora: ${esc(Voz.micAtual)}</div>` : ""}
    </div>
    <div class="cfg-sec"><b>🎧 Saída de áudio (fone ou caixa)</b>
      ${d.podeEscolherSaida ? `<select data-saida>${ops(d.saidas, pf.saida)}</select>` : `<div class="cfg-nota">Este navegador não deixa escolher a saída: o som vai para a saída padrão do sistema. No Chrome ou Edge dá para escolher.</div>`}
      <div class="cfg-row"><button class="btn" data-testar>🔔 Testar som</button></div>
    </div>
    <div class="cfg-sec"><b>👥 Volume de cada pessoa <small style="color:var(--mut);font-weight:500">· só para você</small></b>
      ${pessoas.length ? pessoas.map(o => {
        const v = Math.round(Voz.volumePessoa(o.id) * 100);
        return `<div class="pessoa${o.id === cfgFoco ? " foco" : ""}" data-pessoa="${esc(o.id)}">
          <div class="nm">${esc(o.nome)} <small>${o.ouvindo ? "· 🔊 ouvindo agora" : "· longe"}</small></div>
          ${v !== 100 ? `<button class="reset" data-reset>voltar a 100%</button>` : "<span></span>"}
          <div class="ctl"><button class="mute${v === 0 ? " on" : ""}" data-mute title="${v === 0 ? "Voltar a ouvir" : "Silenciar só para mim"}">${v === 0 ? "🔇" : "🔈"}</button>
            <input type="range" min="0" max="${max}" step="5" value="${Math.min(v, max)}" data-vol aria-label="Volume de ${esc(o.nome)}"><span class="pct">${v}%</span></div>
        </div>`; }).join("") : `<div class="cfg-nota">Ninguém mais no escritório agora. Quando alguém entrar, o volume dele aparece aqui — ou clique no personagem da pessoa no mapa.</div>`}
      <div class="cfg-nota">Dica: clique em alguém no mapa para ajustar o volume dessa pessoa. ${d.volumeMax > 1 ? "Dá para subir até 200%." : "Neste navegador o máximo é 100%."}</div>
    </div>`;
}
const ultimoVol = {};
cfg.addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) { fecharConfigAudio(); return; }
  if (e.target.closest("[data-permitir]")) { if (await Voz.pedirPermissao()) { await renderConfigAudio(); iniciarMedidor(); } else toast("O navegador bloqueou o microfone"); return; }
  if (e.target.closest("[data-testar]")) { Voz.testarSaida(); return; }
  const linha = e.target.closest("[data-pessoa]"); if (!linha) return;
  const id = linha.dataset.pessoa, atual = Voz.volumePessoa(id);
  if (e.target.closest("[data-mute]")) {
    if (atual > 0){ ultimoVol[id] = atual; Voz.definirVolumePessoa(id, 0); }
    else Voz.definirVolumePessoa(id, ultimoVol[id] || 1);
  } else if (e.target.closest("[data-reset]")) Voz.definirVolumePessoa(id, 1);
  else return;
  cfgFoco = id; await renderConfigAudio(); iniciarMedidor();
});
cfg.addEventListener("input", e => {
  const r = e.target.closest("[data-vol]"); if (!r) return;
  const linha = r.closest("[data-pessoa]"), v = +r.value;
  Voz.definirVolumePessoa(linha.dataset.pessoa, v / 100);
  linha.querySelector(".pct").textContent = v + "%";
  const m = linha.querySelector("[data-mute]"); m.classList.toggle("on", v === 0); m.textContent = v === 0 ? "🔇" : "🔈";
});
cfg.addEventListener("change", async e => {
  if (e.target.matches("[data-mic]")) {
    const r = await Voz.trocarMic(e.target.value);
    toast(r.ok ? (Voz.ligado ? "Microfone trocado" : "Microfone salvo — vale ao ligar o áudio") : "Não consegui usar esse microfone");
    atualizarBotaoAudio(); await renderConfigAudio(); iniciarMedidor();
  } else if (e.target.matches("[data-saida]")) {
    const ok = await Voz.aplicarSaida(e.target.value);
    toast(ok ? "Saída de áudio trocada" : "Não consegui usar essa saída"); if (ok) Voz.testarSaida();
  } else if (e.target.matches("[data-ruido],[data-eco]")) {
    await Voz.processamento({ ruido: cfg.querySelector("[data-ruido]").checked, eco: cfg.querySelector("[data-eco]").checked });
    toast("Ajuste do microfone aplicado"); iniciarMedidor();
  }
});
addEventListener("voz:dispositivos", () => { if (cfgAberto) renderConfigAudio().then(iniciarMedidor); });

function abrirConfigSala(){

    <div class="cfg-sala">
      <label>Nome<input id="cfgNome" maxlength="40" value="${esc(infoEspaco.nome)}"></label>
      <div class="cfg-modos">${[["2d", "2D", "Visão de cima"], ["3d", "3D", "Primeira pessoa"], ["ambos", "2D e 3D", "Cada um escolhe"]].map(([v, t, d]) =>

async function salvarConfigSala(){
  const nome = (document.getElementById("cfgNome").value || "").trim(), modo = (menu.querySelector("[name=cfgModo]:checked") || {}).value || modoSala;
  if (!nome) return toast("Dê um nome para a sala");
  try {
    const m = await Dados.configurarSala(mapaId, { nome, modo });
    S.espaco = m.espaco; S.name = m.name; lerEspaco(); Dados.lembrarSala(mapaId, nome); aplicarModo3d(); atualizarBotaoVista && atualizarBotaoVista();
    menu.classList.add("hidden"); toast("⚙️ Sala atualizada");
  } catch (e) { toast("Não consegui salvar: " + (e.message || "")); }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
let toastT = null;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); }
