<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escritório – Next Co.</title>
<link rel="stylesheet" href="css/base.css">
<style>
html,body{height:100%;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;z-index:10;pointer-events:none}
.top>*{pointer-events:auto}
#sala{padding:9px 13px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
#eu{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;font-weight:650;font-size:14px}
#eu canvas{width:30px;height:30px;border-radius:8px;background:#cfc7b6}
.zoom{position:fixed;right:8px;top:62px;display:flex;flex-direction:column;z-index:10;overflow:hidden}
.zoom button{width:42px;height:42px;font-size:20px;font-weight:700}
.emotes{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;z-index:10}
.emotes button{padding:9px 12px;border-radius:9px;font-weight:650;font-size:13px;white-space:nowrap}
.emotes button:active{background:var(--chip)}
#btnAudio.mudo{background:#e5484d!important}
@media (max-width:760px){.emotes button{padding:8px 9px;font-size:12px}}
#hint{position:fixed;left:8px;top:62px;z-index:9;font-size:12px;color:#fff;background:rgba(20,16,32,.7);padding:6px 10px;border-radius:9px;pointer-events:none}
#joy{position:fixed;left:22px;bottom:84px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);z-index:11;display:none;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sheet{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:auto;transition:transform .18s ease}
@media (max-width:760px){.sheet{left:0;right:0;bottom:0;max-height:70vh;border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}.sheet.hidden{transform:translateY(105%)}#sala{max-width:42vw}}
@media (min-width:761px){.sheet{top:60px;right:60px;width:340px;max-height:calc(100vh - 130px);border-radius:14px;padding:14px}.sheet.hidden{transform:translateX(calc(100% + 90px))}}
.sheet h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;font-size:22px;width:34px;height:34px;border-radius:8px}
.mi{display:flex;width:100%;text-align:left;padding:11px 10px;border-radius:9px;font-weight:600;gap:10px;align-items:center;text-decoration:none;color:inherit}
.mi:hover{background:var(--chip)}
.sep{height:1px;background:var(--line);margin:6px 0}
.act{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.act b{display:block}.act small{color:var(--mut)}
.ico{width:28px;height:28px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* ---- configurações de áudio ---- */
.cfg-sec{margin:4px 0 14px}
.cfg-sec>b{display:block;font-size:13px;margin:0 0 6px}
.cfg-sec select{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 10px;font-size:14px}
.cfg-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.cfg-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.medidor{height:8px;border-radius:5px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.medidor i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbf5f,#c9d13f 70%,#e5484d);transition:width .06s}
.cfg-nota{font-size:12px;color:var(--mut);margin-top:6px}
.pessoa{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;align-items:center}
.pessoa.foco{border-color:var(--brand);box-shadow:0 0 0 2px rgba(61,90,254,.25)}
.pessoa .nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pessoa .nm small{color:var(--mut);font-weight:500}
.pessoa .ctl{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.pessoa input[type=range]{flex:1;accent-color:var(--brand)}
.pessoa .pct{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:650}
.pessoa .mute{width:34px;height:30px;border-radius:8px;background:var(--chip);border:1px solid var(--line)}
.pessoa .mute.on{background:#e5484d;color:#fff;border-color:#e5484d}
.pessoa .reset{font-size:12px;color:var(--brand);font-weight:650}
#btnCfgAudio{padding:9px 10px}
#load{position:fixed;inset:0;display:grid;place-items:center;color:#fff;z-index:50;background:#16141f;font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <div class="pill" id="sala">Carregando…</div>
  <button class="pill" id="eu" aria-label="Menu"><canvas id="mini" class="px" width="32" height="32"></canvas><span id="nome"></span></button>
</div>
<div class="zoom pill"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button></div>
<div class="emotes pill">
  <button id="btnAudio" style="background:#3d5afe;color:#fff">🎧 Ligar áudio</button><button id="btnCfgAudio" title="Microfone, saída de áudio e volume de cada pessoa" aria-label="Configurar áudio">⚙️</button><button data-emote="5">👋 Acenar</button><button data-emote="6">💃 Dançar</button><button data-emote="4">🪑 Sentar/levantar</button>
</div>
<button class="pill" id="btnTelao" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:12;padding:11px 16px;font-weight:800;font-size:14px;background:#3d5afe;color:#fff;border-color:#3d5afe">📊 Abrir telão</button>
<div id="hint">Setas/WASD ou clique para andar · pare perto de uma cadeira para sentar</div>
<div id="joy"><div id="knob"></div></div>
<aside id="menu" class="sheet hidden"></aside>
<aside id="audioCfg" class="sheet hidden" aria-label="Configurações de áudio"></aside>
<div id="toast"></div>
<div id="load">Entrando no escritório…</div>
<script src="assets.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/dados.js"></script>
<script src="js/mapa-core.js"></script>
<script src="js/avatar.js"></script>
<script src="js/vida.js"></script>
<script src="js/telao.js"></script>
<script src="js/sala.js"></script>
<script src="js/voz.js"></script>
<script>
let EMAIL = null;
window.OCULTAR_PESSOAS = true; // no escritório só aparecem pessoas de verdade
let S = null, grid = null, user = null, assentos = [];
const mapaId = "principal";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let DPR = 1, VW = 0, VH = 0, zoom = innerWidth <= 760 ? 1.6 : 2;
let P = null, tarefas = [], teloes = [], monitores = []; const outros = []; // outras pessoas (entram aqui quando houver modo com várias pessoas)
const keys = new Set(); let joyV = null;

function resize(){ DPR = Math.min(devicePixelRatio || 1, 2); VW = innerWidth; VH = innerHeight; cv.width = VW*DPR; cv.height = VH*DPR; }
addEventListener("resize", resize); resize();

function onAssetsReady(){ buildPatterns(ctx); boot(); }
if (imgsLeft === 0) onAssetsReady();

async function boot(){
  EMAIL = await Dados.exigirSessao("index.html"); if (!EMAIL) return;
  Voz.configurar(EMAIL);
  user = await Dados.getUsuario(EMAIL);
  if (!user.avatar) { location.href = "avatar.html"; return; }
  document.getElementById("nome").textContent = user.nome;
  S = await Dados.carregarMapa(mapaId);
  if (!S) { S = templateNext(); Dados.salvarMapaLocal(mapaId, S); }
  grid = buildBlocked();
  assentos = construirAssentos();
  teloes = allItems().filter(i => i.k === "telao");
  monitores = allItems().filter(i => EQUIP.test(i.k));
  await atualizarTarefas(); setInterval(atualizarTarefas, 30000); Dados.ouvirTarefas(atualizarTarefas);
  Dados.ouvirMapa(mapaId, novoMapa => recarregarMapa(novoMapa));
  const sheet = await Avatar.montar(user.avatar);
  P = new Ator({ id: Dados.meuId(), nome: user.nome, sheet, x: 0, y: 0 });
  const m = document.getElementById("mini").getContext("2d"); m.imageSmoothingEnabled = false; m.drawImage(sheet, 8, 4, 16, 16, 0, 0, 32, 32);
  spawn();
  conectarSala();
  document.getElementById("load").remove();
  if (matchMedia("(pointer:coarse)").matches) { document.getElementById("joy").style.display = "block"; document.getElementById("hint").textContent = "Use o controle ou toque no chão para andar"; }
  setTimeout(() => document.getElementById("hint").style.opacity = 0, 8000);
  checarSala(true);
  last = performance.now(); requestAnimationFrame(loop);
}
async function atualizarTarefas(){ tarefas = await Dados.listarTarefas(); }
/* ---------- outras pessoas em tempo real ---------- */
const sheets = {};
function montarSheet(av){ const k = JSON.stringify(av || {}); return sheets[k] || (sheets[k] = Avatar.montar(av)); }
function conectarSala(){
  Sala.entrar({
    id: P.id,
    presenca: () => ({ id: P.id, nome: user.nome, avatar: user.avatar }),
    aoEntrar(id, m){ const a = new Ator({ id, nome: m.nome, sheet: null, x: 0, y: 0, visto: false }); outros.push(a);
      montarSheet(m.avatar).then(sh => a.sheet = sh); toast(`${m.nome} entrou no escritório`); },
    aoMudar(id, m){ const a = outros.find(o => o.id === id); if (!a) return; a.nome = m.nome; montarSheet(m.avatar).then(sh => a.sheet = sh); },
    aoSair(id){ const i = outros.findIndex(o => o.id === id); if (i < 0) return; const a = outros[i];
      if (a.assento) { a.assento.ocupante = null; a.assento = null; } outros.splice(i, 1); toast(`${a.nome} saiu`); },
    aoMover(id, st){
      const a = outros.find(o => o.id === id); if (!a) return;
      if (!a.visto){ a.x = st.x; a.y = st.y; a.visto = true; }
      a.alvo = { x: st.x, y: st.y }; a.dir = st.dir; a.remotoAndando = !!st.mov; a.mic = !!st.mic;
      if (st.emote !== a.emote){ a.emote = st.emote; a.emoteT = 0; }
      const atual = a.assento ? a.assento.id : null;
      if (st.assento !== atual){
        if (a.assento){ a.assento.ocupante = null; a.assento = null; }
        const s = st.assento && assentos.find(s => s.id === st.assento);
        if (s && (!s.ocupante || s.ocupante === a)){ s.ocupante = a; a.assento = s; }
      }
    },
    aoSinal: msg => Voz.aoSinal(msg),
    aoDesconectar(){ toast("Conexão instável… tentando de novo"); },
  });
}
function moverOutros(dt){
  for (const a of outros){
    if (!a.visto || !a.alvo) continue;
    if (a.emote != null) a.emoteT += dt;
    if (a.assento){ a.moving = false; continue; }
    const dx = a.alvo.x - a.x, dy = a.alvo.y - a.y, d = Math.hypot(dx, dy);
    if (d > 200){ a.x = a.alvo.x; a.y = a.alvo.y; }
    else { const k = Math.min(1, dt*10); a.x += dx*k; a.y += dy*k; }
    a.moving = a.remotoAndando || d > 1.5;
    if (a.moving){ a.anim += dt*8; a.frame = 1 + (Math.floor(a.anim) % 4); } else a.frame = 0;
  }
}
function recarregarMapa(novo){
  for (const a of [P, ...outros]) if (a.assento){ a.assento.ocupante = null; a.assento = null; }
  S = novo; grid = buildBlocked(); assentos = construirAssentos();
  teloes = allItems().filter(i => i.k === "telao"); monitores = allItems().filter(i => EQUIP.test(i.k));
  if (!livre(P.x, P.y)) spawn();
  toast("O mapa do escritório foi atualizado");
}
/* ---------- áudio ---------- */
async function ligarAudio(){
  const b = document.getElementById("btnAudio");
  if (!Voz.ligado){
    b.textContent = "⏳ Ligando…";
    const r = await Voz.ativar(P.id);
    if (!r.comMicrofone) toast("Sem permissão do microfone: você ouve, mas não fala");
    Dados.registrarAtividade(EMAIL, "audio", r.comMicrofone ? "Ligou o áudio com microfone" : "Ligou o áudio só para ouvir");
  } else Voz.alternarMic();
  atualizarBotaoAudio();
}
function atualizarBotaoAudio(){
  const b = document.getElementById("btnAudio");
  if (!Voz.ligado) b.textContent = "🎧 Ligar áudio";
  else if (!Voz.temMic) b.textContent = "🔈 Só ouvindo";
  else b.textContent = Voz.micAberto ? "🎙️ Microfone ligado" : "🔇 Microfone mudo";
  b.classList.toggle("mudo", Voz.ligado && !Voz.micAberto);
}
function abrirTelao(){
  if (Telao.aberto) return; keys.clear(); joyV = null; if (P) P.path = null;
  Dados.registrarAtividade(EMAIL, "telao", "Abriu o telão da equipe");
  Telao.abrir({ email: EMAIL, nome: user.nome, aoFechar: atualizarTarefas });
}
document.getElementById("btnTelao").onclick = abrirTelao;
function livre(x, y){ // caixa dos pés (12x6 px) livre?
  for (const [dx, dy] of [[-6,-3],[6,-3],[-6,3],[6,3]]) if (grid.blocked(Math.floor((x+dx)/C16), Math.floor((y+dy)/C16))) return false;
  return x > 8 && y > 8 && x < S.w*T-8 && y < S.h*T-8;
}
function spawn(){
  const pos = user.posicao;
  if (pos && pos.mapa === mapaId && livre(pos.x, pos.y)) { P.x = pos.x; P.y = pos.y; P.dir = pos.direcao || 0; return; }
  const r = S.rooms.find(r => r.type === "recepcao") || S.rooms[0];
  let cx = r ? (r.x + r.w/2)*T : S.w*T/2, cy = r ? (r.y + r.h/2)*T : S.h*T/2;
  for (let rad = 0; rad < 40; rad++) for (let a = 0; a < 16; a++){
    const x = cx + Math.cos(a/16*Math.PI*2)*rad*16, y = cy + Math.sin(a/16*Math.PI*2)*rad*16;
    if (livre(x, y)) { P.x = x; P.y = y; return; }
  }
  P.x = cx; P.y = cy;
}

/* ---------- entrada ---------- */
const DIRKEYS = {ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
addEventListener("keydown", e => { if (e.target.matches("input,select,textarea") || Telao.aberto) return; if (DIRKEYS[e.key]) { keys.add(e.key); if (P) { P.path = null; P.emote = null; } e.preventDefault(); }
  if (e.key === "1") emote(5); if (e.key === "2") emote(6); if (e.key === "3") sentarPerto(); });
addEventListener("keyup", e => keys.delete(e.key));
addEventListener("blur", () => keys.clear());
const toWorld = (sx, sy) => { const c = cam(); return [(sx - c.ox)/zoom, (sy - c.oy)/zoom]; };
const ptrs = new Map(); let pinch = null, pularUp = 0;
cv.addEventListener("pointerdown", e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  document.getElementById("menu").classList.add("hidden"); fecharConfigAudio();
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), z: zoom}; }
});
cv.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size === 2){ const [a,b] = [...ptrs.values()]; zoom = Math.max(0.6, Math.min(4, pinch.z * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d)); } });
const up = e => {
  const had = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (pinch){ if (ptrs.size < 2){ pinch = null; pularUp = ptrs.size; } return; }
  if (pularUp > 0){ pularUp--; return; }
  if (!had || !grid || !P) return;
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  const pessoa = outros.find(o => o.visto && o.sheet && Math.abs(o.px - wx) < 12 && wy > o.py - 34 && wy < o.py + 4);
  if (pessoa){ abrirConfigAudio(pessoa.id); return; }
  for (const it of teloes){ if (wx >= it.x*T && wx <= it.x*T + 192 && wy >= it.y*T && wy <= it.y*T + 90){ abrirTelao(); return; } }
  // clicou num assento? vai até ele e senta
  let alvo = null, bd = 1e9;
  for (const s of assentos){ if (s.ocupante && s.ocupante !== P) continue; const d = Math.hypot(s.sx - wx, s.sy - 4 - wy); if (d < 18 && d < bd){ bd = d; alvo = s; } }
  if (P.assento) P.levantar();
  const [gx, gy] = alvo ? [alvo.sx, alvo.sy + 6] : [wx, wy];
  const path = findPath(grid, Math.floor(P.x/C16), Math.floor(P.y/C16), Math.floor(gx/C16), Math.floor(gy/C16));
  if (path && path.length) { P.path = path; P.emote = null; P.saiuDe = null; marca = {x: path[path.length-1][0], y: path[path.length-1][1], t: 1}; }
  else toast("Não dá para chegar aí");
};
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", e => { ptrs.delete(e.pointerId); pinch = null; });
cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.6, Math.min(4, zoom * Math.exp(-e.deltaY*0.0015))); }, {passive:false});
document.getElementById("zin").onclick = () => zoom = Math.min(4, zoom*1.25);
document.getElementById("zout").onclick = () => zoom = Math.max(0.6, zoom/1.25);
// joystick
const joy = document.getElementById("joy"), knob = document.getElementById("knob");
let joyId = null;
joy.addEventListener("pointerdown", e => { joyId = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (_) {} joyMove(e); });
joy.addEventListener("pointermove", e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joyV = null; knob.style.transform = ""; };
joy.addEventListener("pointerup", joyEnd); joy.addEventListener("pointercancel", joyEnd);
function joyMove(e){
  const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const d = Math.hypot(dx, dy), max = 40; if (d > max){ dx *= max/d; dy *= max/d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joyV = d > 8 ? [dx/max, dy/max] : null; if (joyV && P){ P.path = null; P.emote = null; }
}
document.getElementById("btnAudio").onclick = e => { e.stopPropagation(); ligarAudio(); };
document.getElementById("btnCfgAudio").onclick = e => { e.stopPropagation(); const el = document.getElementById("audioCfg"); el.classList.contains("hidden") ? abrirConfigAudio() : fecharConfigAudio(); };
document.querySelector(".emotes").onclick = e => { const b = e.target.closest("[data-emote]"); if (!b) return; const r = +b.dataset.emote; r === 4 ? sentarPerto() : emote(r); };
function emote(row){
  if (!P) return; if (P.assento) P.levantar();
  P.emote = row; P.emoteT = 0; P.path = null;
  Dados.registrarAtividade(EMAIL, "acao", `${row === 5 ? "Acenou" : "Dançou"}${P.sala ? " em " + P.sala : ""}`, {sala: P.sala});
}
function sentarPerto(){
  if (!P) return; if (P.assento){ P.levantar(); return; }
  let alvo = null, bd = 1e9;
  for (const s of assentos){ if (s.ocupante) continue; const d = Math.hypot(s.sx - P.x, s.sy - P.y); if (d < 120 && d < bd){ bd = d; alvo = s; } }
  if (!alvo){ toast("Chegue perto de uma cadeira, sofá ou pufe"); return; }
  const path = findPath(grid, Math.floor(P.x/C16), Math.floor(P.y/C16), Math.floor(alvo.sx/C16), Math.floor((alvo.sy + 6)/C16));
  if (path) { P.path = path; P.saiuDe = null; } else P.sentar(alvo);
}

/* ---------- loop ---------- */
let last = 0, marca = null, sujo = false, ultimoSave = 0, t = 0;
const VEL = 120, conversasLog = {};
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; t += dt;
  // você
  let vx = 0, vy = 0;
  for (const k of keys){ const d = DIRKEYS[k]; if (d){ vx += d[0]; vy += d[1]; } }
  if (joyV){ vx = joyV[0]; vy = joyV[1]; }
  if ((vx || vy) && P.assento) P.levantar();
  if (!vx && !vy && !P.assento && P.path) [vx, vy] = seguirCaminho(P);
  if (!P.assento) moverAtor(P, dt, vx, vy, livre, VEL); else { P.moving = false; P.parado += dt; }
  if (P.moving){ P.emote = null; sujo = true; }
  if (P.emote != null){ P.emoteT += dt; if (P.emoteT > 3) P.emote = null; }
  if (P.saiuDe && Math.hypot(P.saiuDe.sx - P.x, P.saiuDe.sy - P.y) > 40) P.saiuDe = null;
  if (!P.assento && !P.moving && !P.path && P.parado > 0.35 && P.emote == null){
    const s = assentoPerto(assentos, P.x, P.y);
    if (s && s !== P.saiuDe && P.sentar(s)){
      sujo = true;
      Dados.registrarAtividade(EMAIL, "acao", s.trabalho ? `Sentou para trabalhar${P.sala ? " em " + P.sala : ""}` : `Sentou${s.sala ? " em " + s.sala : ""}`, {sala: s.sala});
    }
  }
  moverOutros(dt);
  const visiveis = outros.filter(o => o.visto && o.sheet);
  Voz.atualizar(P, visiveis, now);
  Sala.enviarPosicao({ x: Math.round(P.x), y: Math.round(P.y), dir: P.dir, mov: P.moving, assento: P.assento ? P.assento.id : null, emote: P.emote, mic: Voz.micAberto }, now);
  atualizarConversas([P, ...visiveis], dt, (a, o) => {
    if (a !== P) return;
    const agora = Date.now(); if (conversasLog[o.nome] && agora - conversasLog[o.nome] < 60000) return;
    conversasLog[o.nome] = agora;
    Dados.registrarAtividade(EMAIL, "conversa", `Conversou com ${o.nome}${P.sala ? " em " + P.sala : ""}`, {sala: P.sala, com: o.nome});
  });
  const perto = teloes.some(it => Math.hypot(it.x*T + 96 - P.px, it.y*T + 96 - P.py) < 120);
  const bt = document.getElementById("btnTelao"); const mostra = perto && !Telao.aberto ? "block" : "none"; if (bt.style.display !== mostra) bt.style.display = mostra;
  for (const a of [P, ...visiveis]){ a.vozReal = now - (a.vozAtiva || -1e9) < 350; if (Voz.ligado) a.falando = a.vozReal; else if (a.vozReal) a.falando = true; }
  checarSala(false);
  if (sujo && now - ultimoSave > 4000){ salvarPos(); ultimoSave = now; }
  if (marca){ marca.t -= dt*1.5; if (marca.t <= 0) marca = null; }
  draw();
  requestAnimationFrame(loop);
}
function salvarPos(){ if (!P) return; sujo = false; const v = P.assento && P.volta ? P.volta : P;
  Dados.salvarPosicao(EMAIL, {mapa: mapaId, x: Math.round(v.x), y: Math.round(v.y), direcao: P.dir}); }
addEventListener("pagehide", salvarPos);
document.addEventListener("visibilitychange", () => { if (document.hidden) salvarPos(); });
function checarSala(first){
  const r = roomAt(P.px, P.py - 4);
  const nome = r ? r.name : "Área externa";
  if (nome === P.sala && !first) return;
  P.sala = nome;
  const z = Voz.zona(P), regra = z.tipo === "fechada" ? " · 🔒 só quem está aqui ouve" : z.tipo === "silencio" ? " · 🤫 sem áudio" : " · 🗣 ouve quem está perto";
  document.getElementById("sala").textContent = "📍 " + nome + regra;
  if (!first) Dados.registrarAtividade(EMAIL, "sala", `Entrou em ${nome}`, {sala: nome});
}
function cam(){
  const W = S.w*T*zoom, H = S.h*T*zoom;
  let ox = VW/2 - P.px*zoom, oy = VH/2 - (P.py - 20)*zoom;
  if (W > VW) ox = Math.min(0, Math.max(VW - W, ox)); else ox = (VW - W)/2;
  if (H > VH) oy = Math.min(0, Math.max(VH - H, oy)); else oy = (VH - H)/2;
  return {ox: Math.round(ox), oy: Math.round(oy)};
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = "#16141f"; ctx.fillRect(0, 0, cv.width, cv.height);
  const c = cam(), atores = [P, ...outros.filter(o => o.visto && o.sheet)];
  const ligados = new Set(); for (const a of atores) if (a.assento && a.assento.trabalho) for (const m of a.assento.monitores) ligados.add(m.x + "," + m.y);
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(zoom*DPR, 0, 0, zoom*DPR, c.ox*DPR, c.oy*DPR);
  drawWorld(ctx, atores.map(a => ({ sort: a.sort(), draw: g => a.draw(g, t) })).concat(teloes.map(it => ({ sort: sortKey(it) + 0.01, draw: g => Telao.desenharTela(g, it.x*T, it.y*T, tarefas) })))
    .concat(monitores.map(it => ({ sort: sortKey(it) + 0.01, draw: g => desenharMonitor(g, it, ligados.has(it.x + "," + it.y), t) }))));
  for (const a of atores) a.balao(ctx, t);
  if (marca){ ctx.strokeStyle = `rgba(61,90,254,${marca.t})`; ctx.lineWidth = 2/zoom*1.5; ctx.beginPath(); ctx.ellipse(marca.x, marca.y, 10*(1.6-marca.t*.6), 5*(1.6-marca.t*.6), 0, 0, Math.PI*2); ctx.stroke(); }
  // nomes (tela)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const a of atores){
    const naMesa = a.assento && a.assento.trabalho;
    const sx = a.px*zoom + c.ox, top = a.assento ? a.assento.sy - 40 : a.y - 45, sy = naMesa ? (a.assento.sy + 14)*zoom + c.oy + 19 : (top - 2)*zoom + c.oy;
    if (sx < -60 || sx > VW + 60 || sy < -40 || sy > VH + 40) continue;
    const vp = a !== P ? (a.volPessoal ?? Voz.volumePessoa(a.id)) : 1;
    const txt = a.nome + (vp === 0 ? " 🔇" : a !== P && a.ouvindo ? " 🔊" : "") + (vp > 0 && vp < 0.99 ? ` ${Math.round(vp*100)}%` : vp > 1.01 ? ` ${Math.round(vp*100)}%` : "") + (a.vozReal ? " 🗣" : "");
    ctx.font = "700 12px system-ui,sans-serif"; const w = ctx.measureText(txt).width + 12;
    ctx.fillStyle = a === P ? "rgba(61,90,254,.92)" : "rgba(20,16,32,.72)"; ctx.beginPath(); ctx.roundRect(sx - w/2, sy - 19, w, 17, 6); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, sx, sy - 10.5); ctx.textAlign = "left";
  }
}

/* ---------- menu ---------- */
const menu = document.getElementById("menu");
document.getElementById("eu").onclick = async () => {
  if (!menu.classList.contains("hidden")) { menu.classList.add("hidden"); return; }
  fecharConfigAudio();
  const acts = await Dados.listarAtividades(EMAIL, 40);
  const ico = {cadastro:"✨", entrou:"🚪", saiu:"👋", avatar:"🧍", sala:"📍", acao:"🎉", editor:"🛠️", conversa:"💬", tarefa:"✅", telao:"📊"};
  menu.innerHTML = `<h3>${esc(user.nome)} <button class="x" data-close aria-label="Fechar">×</button></h3>
    <div style="color:var(--mut);font-size:13px;margin:-6px 0 8px">${esc(user.email)} · ${Sala.online} online agora</div>
    <a class="mi" href="avatar.html">🧍 Editar meu personagem</a>
    <button class="mi" data-telao>📊 Telão da equipe</button>
    <button class="mi" data-cfgaudio>🎚️ Áudio: microfone, saída e volumes</button>
    <a class="mi" href="editor.html">🛠️ Editor de salas</a>
    <button class="mi" data-exp>💾 Baixar meus dados (JSON)</button>
    <button class="mi" data-sair>🚪 Sair</button>
    <div class="sep"></div>
    <div style="font-weight:700;margin:8px 0 4px">O que eu fiz</div>
    ${acts.map(a => `<div class="act"><div class="ico">${ico[a.tipo]||"•"}</div><div><b>${esc(a.detalhe||a.tipo)}</b><small>${new Date(a.quando).toLocaleString("pt-BR")}</small></div></div>`).join("") || `<p style="color:var(--mut)">Nada ainda.</p>`}`;
  menu.classList.remove("hidden");
};
menu.onclick = async e => {
  if (e.target.closest("[data-close]")) menu.classList.add("hidden");
  if (e.target.closest("[data-telao]")) { menu.classList.add("hidden"); abrirTelao(); }
  if (e.target.closest("[data-cfgaudio]")) { menu.classList.add("hidden"); abrirConfigAudio(); }
  if (e.target.closest("[data-sair]")) { salvarPos(); await Dados.sair(); location.href = "index.html"; }
  if (e.target.closest("[data-exp]")) {
    const dados = { usuario: await Dados.getUsuario(EMAIL), atividades: await Dados.listarAtividades(EMAIL, 1000) };
    const blob = new Blob([JSON.stringify(dados, null, 2)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `meus-dados-${EMAIL}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
};

/* ---------- configurações de áudio (dispositivos e volume de cada pessoa) ---------- */
const cfg = document.getElementById("audioCfg");
let cfgFoco = null, cfgTeste = null, cfgRaf = 0, cfgAberto = false;
async function abrirConfigAudio(foco){
  cfgFoco = foco || null;
  document.getElementById("menu").classList.add("hidden");
  cfgAberto = true; cfg.classList.remove("hidden");
  await renderConfigAudio();
  if (cfgFoco){ const el = cfg.querySelector(`[data-pessoa="${CSS.escape(cfgFoco)}"]`); if (el) el.scrollIntoView({block: "center", behavior: "smooth"}); }
  iniciarMedidor();
}
function fecharConfigAudio(){
  if (!cfgAberto) return; cfgAberto = false;
  cfg.classList.add("hidden"); cancelAnimationFrame(cfgRaf);
  if (cfgTeste){ cfgTeste.parar(); cfgTeste = null; }
}
async function iniciarMedidor(){
  if (cfgTeste){ cfgTeste.parar(); cfgTeste = null; }
  cancelAnimationFrame(cfgRaf);
  const barra = cfg.querySelector(".medidor i"); if (!barra) return;
  cfgTeste = await Voz.testeMic(); if (!cfgTeste || !cfgAberto){ if (cfgTeste && !cfgAberto){ cfgTeste.parar(); cfgTeste = null; } return; }
  const passo = () => { if (!cfgAberto) return; const n = cfgTeste ? cfgTeste.nivel() : 0; barra.style.width = Math.min(100, n*260) + "%"; cfgRaf = requestAnimationFrame(passo); };
  passo();
}
async function renderConfigAudio(){
  const d = await Voz.dispositivos(), pf = Voz.pref;
  const ops = (lista, sel) => `<option value="">Padrão do sistema</option>` +
    lista.filter(x => !x.padrao && x.id !== "communications").map(x => `<option value="${esc(x.id)}"${x.id === sel ? " selected" : ""}>${esc(x.nome)}</option>`).join("");
  const pessoas = outros.filter(o => o.visto).sort((a, b) => (b.ouvindo ? 1 : 0) - (a.ouvindo ? 1 : 0) || a.nome.localeCompare(b.nome));
  const max = Math.round(d.volumeMax * 100);
  cfg.innerHTML = `<h3>🎚️ Áudio <button class="x" data-close aria-label="Fechar">×</button></h3>
    ${d.temNomes ? "" : `<div class="cfg-sec"><button class="btn pri" data-permitir style="width:100%">Permitir microfone para ver os dispositivos</button>
      <div class="cfg-nota">O navegador só mostra o nome dos microfones e fones depois que você permite o acesso.</div></div>`}
    <div class="cfg-sec"><b>🎙️ Microfone (entrada)</b>
      <select data-mic>${ops(d.entradas, pf.mic)}</select>
      <div class="medidor" title="Fale para testar"><i></i></div>
      <div class="cfg-row"><label><input type="checkbox" data-ruido ${pf.ruido ? "checked" : ""}> Redução de ruído</label><label><input type="checkbox" data-eco ${pf.eco ? "checked" : ""}> Cancelar eco</label></div>
      ${Voz.ligado && Voz.micAtual ? `<div class="cfg-nota">Usando agora: ${esc(Voz.micAtual)}</div>` : ""}
    </div>
    <div class="cfg-sec"><b>🎧 Saída de áudio (fone ou caixa)</b>
      ${d.podeEscolherSaida ? `<select data-saida>${ops(d.saidas, pf.saida)}</select>` : `<div class="cfg-nota">Este navegador não deixa escolher a saída: o som vai para a saída padrão do sistema. No Chrome ou Edge dá para escolher.</div>`}
      <div class="cfg-row"><button class="btn" data-testar>🔔 Testar som</button></div>
    </div>
    <div class="cfg-sec"><b>👥 Volume de cada pessoa <small style="color:var(--mut);font-weight:500">· só para você</small></b>
      ${pessoas.length ? pessoas.map(o => {
        const v = Math.round(Voz.volumePessoa(o.id) * 100);
        return `<div class="pessoa${o.id === cfgFoco ? " foco" : ""}" data-pessoa="${esc(o.id)}">
          <div class="nm">${esc(o.nome)} <small>${o.ouvindo ? "· 🔊 ouvindo agora" : "· longe"}</small></div>
          ${v !== 100 ? `<button class="reset" data-reset>voltar a 100%</button>` : "<span></span>"}
          <div class="ctl"><button class="mute${v === 0 ? " on" : ""}" data-mute title="${v === 0 ? "Voltar a ouvir" : "Silenciar só para mim"}">${v === 0 ? "🔇" : "🔈"}</button>
            <input type="range" min="0" max="${max}" step="5" value="${Math.min(v, max)}" data-vol aria-label="Volume de ${esc(o.nome)}"><span class="pct">${v}%</span></div>
        </div>`; }).join("") : `<div class="cfg-nota">Ninguém mais no escritório agora. Quando alguém entrar, o volume dele aparece aqui — ou clique no personagem da pessoa no mapa.</div>`}
      <div class="cfg-nota">Dica: clique em alguém no mapa para ajustar o volume dessa pessoa. ${d.volumeMax > 1 ? "Dá para subir até 200%." : "Neste navegador o máximo é 100%."}</div>
    </div>`;
}
const ultimoVol = {};
cfg.addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) { fecharConfigAudio(); return; }
  if (e.target.closest("[data-permitir]")) { if (await Voz.pedirPermissao()) { await renderConfigAudio(); iniciarMedidor(); } else toast("O navegador bloqueou o microfone"); return; }
  if (e.target.closest("[data-testar]")) { Voz.testarSaida(); return; }
  const linha = e.target.closest("[data-pessoa]"); if (!linha) return;
  const id = linha.dataset.pessoa, atual = Voz.volumePessoa(id);
  if (e.target.closest("[data-mute]")) {
    if (atual > 0){ ultimoVol[id] = atual; Voz.definirVolumePessoa(id, 0); }
    else Voz.definirVolumePessoa(id, ultimoVol[id] || 1);
  } else if (e.target.closest("[data-reset]")) Voz.definirVolumePessoa(id, 1);
  else return;
  cfgFoco = id; await renderConfigAudio(); iniciarMedidor();
});
cfg.addEventListener("input", e => {
  const r = e.target.closest("[data-vol]"); if (!r) return;
  const linha = r.closest("[data-pessoa]"), v = +r.value;
  Voz.definirVolumePessoa(linha.dataset.pessoa, v / 100);
  linha.querySelector(".pct").textContent = v + "%";
  const m = linha.querySelector("[data-mute]"); m.classList.toggle("on", v === 0); m.textContent = v === 0 ? "🔇" : "🔈";
});
cfg.addEventListener("change", async e => {
  if (e.target.matches("[data-mic]")) {
    const r = await Voz.trocarMic(e.target.value);
    toast(r.ok ? (Voz.ligado ? "Microfone trocado" : "Microfone salvo — vale ao ligar o áudio") : "Não consegui usar esse microfone");
    atualizarBotaoAudio(); await renderConfigAudio(); iniciarMedidor();
  } else if (e.target.matches("[data-saida]")) {
    const ok = await Voz.aplicarSaida(e.target.value);
    toast(ok ? "Saída de áudio trocada" : "Não consegui usar essa saída"); if (ok) Voz.testarSaida();
  } else if (e.target.matches("[data-ruido],[data-eco]")) {
    await Voz.processamento({ ruido: cfg.querySelector("[data-ruido]").checked, eco: cfg.querySelector("[data-eco]").checked });
    toast("Ajuste do microfone aplicado"); iniciarMedidor();
  }
});
addEventListener("voz:dispositivos", () => { if (cfgAberto) renderConfigAudio().then(iniciarMedidor); });

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
let toastT = null;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); }
</script>
