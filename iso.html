<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escritório 3D (protótipo) – Next Co.</title>
<link rel="stylesheet" href="css/base.css">
<style>
@font-face{font-family:Inter;font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:800;src:url(assets/fonts/inter-latin-800-normal.woff2) format("woff2")}
html,body{height:100%;overflow:hidden;background:#141221;font-family:Inter,system-ui,sans-serif}
#cena{position:fixed;inset:0;display:block;touch-action:none}
.hud{position:fixed;z-index:5;background:rgba(22,20,31,.74);color:#fff;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 28px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:14px}
#topo{top:10px;left:10px;display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:14px}
#topo small{font-weight:600;color:rgba(255,255,255,.62)}
#topo a{color:#8a9bff;text-decoration:none;font-weight:800;margin-left:6px}
#ajuda{bottom:12px;left:50%;transform:translateX(-50%);padding:9px 14px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);white-space:nowrap}
#ajuda b{color:#fff}
#girar{top:10px;right:10px;display:flex;overflow:hidden}
#girar button{color:#fff;width:44px;height:44px;font-size:18px;font-weight:800}
#girar button:hover{background:rgba(255,255,255,.08)}
.rotulo{position:fixed;z-index:3;transform:translate(-50%,-100%);pointer-events:none;font-weight:800;font-size:12px;color:#fff;background:rgba(22,20,31,.78);padding:4px 10px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rotulo.eu{background:rgba(61,90,254,.95)}
.rotulo.sala{background:rgba(255,255,255,.9);color:#1d1d1f;font-size:11.5px}
#load{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;background:#141221;z-index:9}
@media (max-width:760px){#ajuda{font-size:11px;white-space:normal;width:calc(100% - 24px);text-align:center}#topo small{display:none}}
</style>
</head>
<body>
<canvas id="cena"></canvas>
<div id="topo" class="hud"><span id="ondeEstou">Escritório 3D</span><small>· protótipo isométrico</small><a href="escritorio.html">voltar ao 2D</a></div>
<div id="girar" class="hud"><button id="gEsq" title="Girar câmera (Q)">⟲</button><button id="gDir" title="Girar câmera (E)">⟳</button></div>
<div id="ajuda" class="hud"><b>WASD/setas</b> ou clique no chão para andar · <b>Q/E</b> gira a câmera · <b>roda do mouse</b> aproxima</div>
<div id="load">Montando o escritório em 3D…</div>
<script src="assets.js"></script>
<script src="js/projecao.js"></script>
<script src="js/ti.js"></script>
<script src="js/edicao.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/dados.js"></script>
<script>window.onAssetsReady = () => window.__assetsOk = true;</script>
<script src="js/mapa-core.js"></script>
<script src="js/avatar.js"></script>
<script type="module" src="js/iso.js"></script>
</body>
</html>
