<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telão da equipe – Andar</title><link rel="icon" type="image/png" sizes="32x32" href="assets/marca/favicon-32.png"><link rel="apple-touch-icon" href="assets/marca/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<style>body{background:#121a2b}</style>
</head>
<body>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/dados.js"></script>
<script src="js/telao.js"></script>
<script>
(async () => {
  const EMAIL = await Dados.exigirSessao("index.html"); if (!EMAIL) return;
  const u = await Dados.getUsuario(EMAIL);
  const q = new URLSearchParams(location.search);
  Telao.abrir({ email: EMAIL, nome: u.nome, telaCheia: true, sala: q.get("sala") || null, nomeSala: q.get("nome") || "", salaPadrao: q.get("padrao") || null });
})();
</script>
</body>
</html>
