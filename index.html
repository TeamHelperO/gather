<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar – Escritório Virtual Next Co.</title>
<meta name="description" content="Escritório virtual da Next Co.">
<link rel="stylesheet" href="css/base.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:20px;background:#16141f url("assets/splash.png") center/cover no-repeat;image-rendering:pixelated}
body::before{content:"";position:fixed;inset:0;background:rgba(18,14,30,.55)}
.card{position:relative;width:100%;max-width:400px;padding:26px}
h1{margin:0 0 4px;font-size:24px}
p.sub{margin:0 0 8px;color:var(--mut)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo span{width:40px;height:40px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px}
.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}
.small{font-size:12px;color:var(--mut);margin-top:14px}
#nomeBox{display:none}
</style>
</head>
<body>
<form class="card" id="f" novalidate>
  <div class="logo"><span>N</span><div><b>Next Co.</b><div style="font-size:12px;color:var(--mut)">Escritório virtual</div></div></div>
  <h1>Entrar</h1>
  <p class="sub">Use seu e-mail. Tudo o que você faz fica salvo nele.</p>
  <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="voce@nextco.com.br" required></div>
  <div class="field" id="nomeBox"><label for="nome">Como quer ser chamado?</label><input id="nome" type="text" autocomplete="name" maxlength="30" placeholder="Seu nome"></div>
  <div class="err" id="err"></div>
  <div class="row"><button class="btn pri" id="go" type="submit">Continuar</button></div>
  <p class="small">Primeiro acesso? Você vai criar seu personagem em seguida.</p>
</form>
<script src="js/dados.js"></script>
<script>
const f = document.getElementById("f"), email = document.getElementById("email"), nome = document.getElementById("nome"),
      nomeBox = document.getElementById("nomeBox"), err = document.getElementById("err");
const atual = Dados.sessao();
if (atual) email.value = atual;
let pedindoNome = false;
f.onsubmit = async e => {
  e.preventDefault(); err.textContent = "";
  const em = email.value.trim().toLowerCase();
  if (!Dados.emailValido(em)) { err.textContent = "Digite um e-mail válido."; email.focus(); return; }
  const existe = await Dados.usuarioExiste(em);
  if (!existe && !pedindoNome) { pedindoNome = true; nomeBox.style.display = "flex"; nome.focus(); return; }
  if (!existe && !nome.value.trim()) { err.textContent = "Diga como quer ser chamado."; nome.focus(); return; }
  const u = await Dados.entrar(em, existe ? "" : nome.value);
  location.href = u.avatar ? "escritorio.html" : "avatar.html";
};
email.oninput = () => { if (pedindoNome) { pedindoNome = false; nomeBox.style.display = "none"; } };
</script>
</body>
</html>
